<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Match en cours - Aquilons</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1A56B8;
            --blue-light: #3A76D8;
            --blue-dark: #0E3A80;
            --silver: #A8A9AD;
            --silver-light: #C8C9CD;
            --silver-dark: #78797D;
            --bg: #0C1220;
            --bg-light: #121C30;
            --bg-card: #101828;
            --gray: #8090A8;
            --white: #EDF0F5;
            --win: #4CAF50;
            --loss: #E53935;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: var(--bg-light);
            border-bottom: 3px solid var(--blue);
            padding: 1rem;
            text-align: center;
        }

        .header-logo {
            width: 50px;
            height: auto;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        .header-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--silver-light);
            display: inline;
            vertical-align: middle;
        }

        /* NAV */
        .nav {
            display: flex;
            justify-content: center;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }

        .nav a {
            flex: 1;
            max-width: 160px;
            text-align: center;
            padding: 0.6rem 0.5rem;
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-decoration: none;
            color: var(--silver-dark);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .nav a:hover { color: var(--silver-light); }
        .nav a.active { color: var(--blue-light); border-bottom-color: var(--blue); }

        /* MATCH SELECTOR */
        .match-selector {
            padding: 0.8rem 1rem;
            text-align: center;
            background: rgba(26,86,184,0.04);
            border-bottom: 1px solid rgba(26,86,184,0.1);
        }

        .match-selector select {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(26,86,184,0.3);
            background: var(--bg-card);
            color: var(--white);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* SET INDICATOR */
        .set-indicator {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.8rem;
            align-items: center;
        }

        .set-bubble {
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            border: 2px solid rgba(26,86,184,0.2);
            color: var(--silver-dark);
            background: transparent;
            transition: all 0.3s;
        }

        .set-bubble.active {
            border-color: var(--blue);
            color: var(--blue-light);
            background: rgba(26,86,184,0.1);
        }

        .set-bubble.won {
            border-color: var(--win);
            color: var(--win);
            background: rgba(76,175,80,0.1);
        }

        .set-bubble.lost {
            border-color: var(--loss);
            color: var(--loss);
            background: rgba(229,57,53,0.1);
        }

        .set-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* SCOREBOARD */
        .scoreboard {
            display: flex;
            align-items: stretch;
            max-width: 500px;
            margin: 0 auto;
            padding: 0.5rem 1rem;
            gap: 0.5rem;
        }

        .score-side {
            flex: 1;
            text-align: center;
            padding: 1rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .score-side:active {
            transform: scale(0.97);
        }

        .score-side.aquilon {
            background: linear-gradient(180deg, rgba(26,86,184,0.2) 0%, rgba(26,86,184,0.08) 100%);
            border: 2px solid rgba(26,86,184,0.3);
        }

        .score-side.aquilon:active {
            background: linear-gradient(180deg, rgba(26,86,184,0.35) 0%, rgba(26,86,184,0.15) 100%);
            border-color: var(--blue-light);
        }

        .score-side.adversaire {
            background: linear-gradient(180deg, rgba(168,169,173,0.12) 0%, rgba(168,169,173,0.04) 100%);
            border: 2px solid rgba(168,169,173,0.2);
        }

        .score-side.adversaire:active {
            background: linear-gradient(180deg, rgba(168,169,173,0.25) 0%, rgba(168,169,173,0.1) 100%);
            border-color: var(--silver);
        }

        .score-team-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }

        .score-side.aquilon .score-team-name { color: var(--blue-light); }
        .score-side.adversaire .score-team-name { color: var(--silver); }

        .score-points {
            font-family: 'Oswald', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: var(--white);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }

        .score-tap-hint {
            font-size: 0.65rem;
            color: var(--gray);
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* SERVICE INDICATOR */
        .service-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue-light);
            margin-left: 0.3rem;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-dot.active {
            opacity: 1;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn {
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(26,86,184,0.2);
            background: var(--bg-card);
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { transform: scale(0.95); }
        .btn:hover { color: var(--white); border-color: rgba(26,86,184,0.4); }

        .btn.danger { border-color: rgba(229,57,53,0.2); }
        .btn.danger:hover { color: var(--loss); border-color: rgba(229,57,53,0.4); }

        .btn.primary {
            background: var(--blue);
            color: var(--white);
            border-color: var(--blue);
        }
        .btn.primary:hover { background: var(--blue-light); }

        /* SET HISTORY */
        .set-history {
            max-width: 500px;
            margin: 0.5rem auto;
            padding: 0 1rem;
        }

        .set-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: var(--bg-card);
            border: 1px solid rgba(26,86,184,0.1);
            border-radius: 8px;
            margin-bottom: 0.4rem;
            font-family: 'Oswald', sans-serif;
        }

        .set-result .set-name {
            font-size: 0.8rem;
            color: var(--gray);
            width: 3rem;
        }

        .set-result .set-scores {
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .set-result .set-scores.won { color: var(--win); }
        .set-result .set-scores.lost { color: var(--loss); }

        .set-result .set-winner {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
        }

        .set-result .set-winner.aq {
            background: rgba(76,175,80,0.1);
            color: var(--win);
        }

        .set-result .set-winner.adv {
            background: rgba(229,57,53,0.1);
            color: var(--loss);
        }

        /* MATCH RESULT OVERLAY */
        .match-result-banner {
            display: none;
            max-width: 500px;
            margin: 0.5rem auto;
            padding: 1rem;
            text-align: center;
            border-radius: 12px;
        }

        .match-result-banner.show { display: block; }

        .match-result-banner.win-banner {
            background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(76,175,80,0.05));
            border: 1px solid rgba(76,175,80,0.3);
        }

        .match-result-banner.loss-banner {
            background: linear-gradient(135deg, rgba(229,57,53,0.15), rgba(229,57,53,0.05));
            border: 1px solid rgba(229,57,53,0.3);
        }

        .match-result-banner .result-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .win-banner .result-text { color: var(--win); }
        .loss-banner .result-text { color: var(--loss); }

        .match-result-banner .result-detail {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 0.3rem;
        }

        /* POINT LOG */
        .point-log-toggle {
            text-align: center;
            padding: 0.5rem;
        }

        .point-log-toggle button {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
        }

        .point-log {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 1rem 1rem;
        }

        .point-log.show { display: block; }

        .point-log-inner {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 0.5rem;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid rgba(26,86,184,0.1);
            max-height: 150px;
            overflow-y: auto;
        }

        .point-pip {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
        }

        .point-pip.aq {
            background: rgba(26,86,184,0.3);
            color: var(--blue-light);
        }

        .point-pip.adv {
            background: rgba(168,169,173,0.2);
            color: var(--silver);
        }

        /* SYNC STATUS */
        .sync-status {
            text-align: center;
            padding: 0.3rem;
            font-size: 0.6rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .sync-status.connected { color: var(--win); }
        .sync-status.error { color: var(--loss); }

        .adv-info {
            font-family: 'Inter', sans-serif;
            font-size: 0.6rem;
            color: var(--gray);
            text-transform: none;
            letter-spacing: 0.02em;
            margin-top: 0.1rem;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.7rem;
            color: rgba(128,144,168,0.4);
        }

        /* DISABLED STATE */
        .scoreboard.disabled .score-side {
            pointer-events: none;
            opacity: 0.4;
        }

        .controls.disabled .btn:not(.primary) {
            pointer-events: none;
            opacity: 0.4;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <img src="logo.jpg" alt="Aquilons" class="header-logo">
        <span class="header-title">Match en cours</span>
    </div>

    <div class="nav">
        <a href="index.html">R&eacute;sultats</a>
        <a href="horaire.html">Horaire</a>
        <a href="match.html" class="active">Match</a>
    </div>

    <!-- MATCH SELECTOR -->
    <div class="match-selector">
        <select id="matchSelect" onchange="selectMatch()">
            <option value="">-- Choisir un match --</option>
            <option value="1" data-adv="Husky JDN" data-time="9h30">Match 1 - 9h30 vs Husky JDN</option>
            <option value="2" data-adv="Bleu et Or" data-time="10h30">Match 2 - 10h30 vs Bleu et Or</option>
            <option value="3" data-adv="Express U14" data-time="11h30">Match 3 - 11h30 vs Express U14</option>
            <option value="4" data-adv="Les Condors" data-time="14h30">Match 4 - 14h30 vs Les Condors</option>
            <option value="5" data-adv="Bleu et Or" data-time="16h30">Match 5 - 16h30 vs Bleu et Or</option>
            <option value="6" data-adv="Tigres d'Am&eacute;" data-time="17h30">Match 6 - 17h30 vs Tigres d'Am&eacute;</option>
            <option value="7" data-adv="Husky KS" data-time="19h30">Match 7 - 19h30 vs Husky KS</option>
        </select>
    </div>

    <!-- SYNC STATUS -->
    <div class="sync-status" id="syncStatus">Supabase: connexion...</div>

    <!-- SET INDICATOR -->
    <div class="set-indicator">
        <span class="set-label">Sets</span>
        <div class="set-bubble active" id="set1Bubble">1</div>
        <div class="set-bubble" id="set2Bubble">2</div>
    </div>

    <!-- SCOREBOARD -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-side aquilon" onclick="addPoint('aq')">
            <div class="score-team-name">Aquilons <span class="service-dot" id="serviceAq"></span></div>
            <div class="score-points" id="scoreAq">0</div>
            <div class="score-tap-hint">Toucher = +1</div>
        </div>
        <div class="score-side adversaire" onclick="addPoint('adv')">
            <div class="score-team-name"><span id="advName">Adversaire</span> <span class="service-dot" id="serviceAdv"></span></div>
            <div class="adv-info" id="advInfo"></div>
            <div class="score-points" id="scoreAdv">0</div>
            <div class="score-tap-hint">Toucher = +1</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls" id="controls">
        <button class="btn danger" onclick="undo()">Annuler</button>
        <button class="btn" onclick="resetSet()">Reset set</button>
        <button class="btn" onclick="switchService()">Service</button>
    </div>

    <!-- SET HISTORY -->
    <div class="set-history" id="setHistory"></div>

    <!-- MATCH RESULT -->
    <div class="match-result-banner" id="matchResult"></div>

    <!-- POINT LOG -->
    <div class="point-log-toggle">
        <button onclick="toggleLog()">Voir le d&eacute;tail des points</button>
    </div>
    <div class="point-log" id="pointLog">
        <div class="point-log-inner" id="pointLogInner"></div>
    </div>

    <div class="footer">
        Aquilons &middot; Jean de Br&eacute;beuf &middot; Tournoi CVS 2026
    </div>

<script>
    // ==========================================
    // SUPABASE
    // ==========================================
    var SUPABASE_URL = 'https://rtbmpcitrymeqzpjwneh.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0Ym1wY2l0cnltZXF6cGp3bmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NDgyOTEsImV4cCI6MjA4ODQyNDI5MX0.6qvaCDLDiCX4KZLJHK1_JiPHROoCtiiEQjsBJbS4CiU';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var TOURNOI_ID = 'a0000000-0000-0000-0000-000000000001';
    var matchDbId = null;
    var adversairesMap = {};

    sb.from('adversaires').select('nom_tournoi,region_rseq,rang_regional')
        .eq('tournoi_id', TOURNOI_ID)
        .then(function(res) {
            if (res.data) res.data.forEach(function(a) { adversairesMap[a.nom_tournoi] = a; });
        });

    function setSyncStatus(text, cls) {
        var el = document.getElementById('syncStatus');
        el.textContent = text;
        el.className = 'sync-status ' + (cls || '');
    }

    // Test connection
    sb.from('matchs').select('id').limit(1).then(function(res) {
        if (res.error) { setSyncStatus('Supabase: erreur', 'error'); }
        else { setSyncStatus('Supabase: connect\u00e9', 'connected'); }
    });

    // ==========================================
    // STATE
    // ==========================================
    var state = {
        matchNum: null,
        advName: '',
        currentSet: 1,
        aqScore: 0,
        advScore: 0,
        sets: [],
        pointLog: [],
        serviceAq: true,
        matchDone: false
    };

    var SAVE_KEY = 'aquilons-match-state';

    function saveState() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function loadState() {
        try {
            var s = localStorage.getItem(SAVE_KEY);
            if (s) {
                state = JSON.parse(s);
                applyState();
                // Restore matchDbId from Supabase
                if (state.matchNum) {
                    sb.from('matchs').select('id')
                        .eq('tournoi_id', TOURNOI_ID)
                        .eq('numero', parseInt(state.matchNum))
                        .single()
                        .then(function(res) {
                            if (res.data) matchDbId = res.data.id;
                        });
                }
            }
        } catch(e) {}
    }

    // ==========================================
    // SUPABASE SYNC
    // ==========================================
    function syncToSupabase() {
        if (!matchDbId) return;
        var updates = {
            aq_score_courant: state.aqScore,
            adv_score_courant: state.advScore,
            set_courant: state.currentSet,
            aq_set1: state.sets.length >= 1 ? state.sets[0].aq : null,
            adv_set1: state.sets.length >= 1 ? state.sets[0].adv : null,
            aq_set2: state.sets.length >= 2 ? state.sets[1].aq : null,
            adv_set2: state.sets.length >= 2 ? state.sets[1].adv : null
        };
        if (state.matchDone) {
            var setsWon = state.sets.filter(function(s) { return s.aq > s.adv; }).length;
            var setsLost = state.sets.filter(function(s) { return s.adv > s.aq; }).length;
            updates.statut = setsWon > setsLost ? 'win' : 'loss';
            updates.set_courant = 0;
        } else {
            updates.statut = 'live';
        }
        sb.from('matchs').update(updates).eq('id', matchDbId).then(function(res) {
            if (res.error) setSyncStatus('Erreur sync: ' + res.error.message, 'error');
        });
    }

    // ==========================================
    // UI
    // ==========================================
    function updateAdvInfo(nom) {
        var el = document.getElementById('advInfo');
        var a = adversairesMap[nom];
        if (!a) { el.textContent = ''; return; }
        var parts = [];
        if (a.region_rseq) parts.push(a.region_rseq);
        if (a.rang_regional) parts.push(a.rang_regional + (a.rang_regional === 1 ? 'er' : 'e') + ' r\u00e9gional');
        el.textContent = parts.join(' \u00b7 ');
    }

    function applyState() {
        if (state.matchNum) {
            document.getElementById('matchSelect').value = state.matchNum;
            document.getElementById('advName').textContent = state.advName;
            updateAdvInfo(state.advName);
        }
        document.getElementById('scoreAq').textContent = state.aqScore;
        document.getElementById('scoreAdv').textContent = state.advScore;
        updateSetBubbles();
        renderSetHistory();
        renderPointLog();
        updateService();
        if (state.matchDone) showMatchResult();
        updateDisabledState();
    }

    // ==========================================
    // MATCH SELECTION
    // ==========================================
    function selectMatch() {
        var sel = document.getElementById('matchSelect');
        var opt = sel.options[sel.selectedIndex];
        if (!opt.value) return;

        state = {
            matchNum: opt.value,
            advName: opt.dataset.adv,
            currentSet: 1,
            aqScore: 0,
            advScore: 0,
            sets: [],
            pointLog: [],
            serviceAq: true,
            matchDone: false
        };

        document.getElementById('advName').textContent = state.advName;
        updateAdvInfo(state.advName);
        document.getElementById('scoreAq').textContent = '0';
        document.getElementById('scoreAdv').textContent = '0';
        document.getElementById('setHistory').innerHTML = '';
        document.getElementById('matchResult').className = 'match-result-banner';
        document.getElementById('matchResult').innerHTML = '';
        document.getElementById('pointLogInner').innerHTML = '';
        updateSetBubbles();
        updateService();
        updateDisabledState();
        saveState();

        // Get match UUID from Supabase and set as live
        sb.from('matchs').select('id')
            .eq('tournoi_id', TOURNOI_ID)
            .eq('numero', parseInt(opt.value))
            .single()
            .then(function(res) {
                if (res.data) {
                    matchDbId = res.data.id;
                    // Delete old points for this match (fresh start)
                    sb.from('points').delete().eq('match_id', matchDbId).then(function() {
                        syncToSupabase();
                    });
                }
            });
    }

    // ==========================================
    // SCORING
    // ==========================================
    function addPoint(team) {
        if (!state.matchNum || state.matchDone) return;
        if (state.currentSet > 2) return;

        if (team === 'aq') state.aqScore++;
        else state.advScore++;

        state.pointLog.push(team);

        document.getElementById('scoreAq').textContent = state.aqScore;
        document.getElementById('scoreAdv').textContent = state.advScore;

        state.serviceAq = (team === 'aq');
        updateService();
        renderPointLog();

        // Insert point to Supabase
        if (matchDbId) {
            sb.from('points').insert({
                match_id: matchDbId,
                set_num: state.currentSet,
                equipe: team,
                aq_score: state.aqScore,
                adv_score: state.advScore
            }).then(function() {});
        }

        checkSetEnd();
        saveState();
        syncToSupabase();
    }

    function checkSetEnd() {
        var aq = state.aqScore;
        var adv = state.advScore;

        if ((aq >= 25 || adv >= 25) && Math.abs(aq - adv) >= 2) {
            state.sets.push({ aq: aq, adv: adv });
            renderSetHistory();
            updateSetBubbles();

            if (state.sets.length >= 2) {
                state.matchDone = true;
                showMatchResult();
                updateDisabledState();
            } else {
                state.currentSet = 2;
                state.aqScore = 0;
                state.advScore = 0;
                state.pointLog = [];
                document.getElementById('scoreAq').textContent = '0';
                document.getElementById('scoreAdv').textContent = '0';
                document.getElementById('pointLogInner').innerHTML = '';
                updateSetBubbles();
            }
        }
    }

    function showMatchResult() {
        var setsWon = state.sets.filter(function(s) { return s.aq > s.adv; }).length;
        var setsLost = state.sets.filter(function(s) { return s.adv > s.aq; }).length;
        var won = setsWon > setsLost;

        var banner = document.getElementById('matchResult');
        banner.className = 'match-result-banner show ' + (won ? 'win-banner' : 'loss-banner');

        var s1 = state.sets[0];
        var s2 = state.sets[1];

        banner.innerHTML =
            '<div class="result-text">' + (won ? 'Victoire!' : 'D\u00e9faite') + '</div>' +
            '<div class="result-detail">Set 1: ' + s1.aq + '-' + s1.adv + ' &middot; Set 2: ' + s2.aq + '-' + s2.adv + '</div>';

        updateDisabledState();
    }

    // ==========================================
    // CONTROLS
    // ==========================================
    function undo() {
        if (!state.matchNum || state.matchDone || state.pointLog.length === 0) return;

        var last = state.pointLog.pop();
        if (last === 'aq') state.aqScore = Math.max(0, state.aqScore - 1);
        else state.advScore = Math.max(0, state.advScore - 1);

        document.getElementById('scoreAq').textContent = state.aqScore;
        document.getElementById('scoreAdv').textContent = state.advScore;
        renderPointLog();
        saveState();

        // Delete last point from Supabase
        if (matchDbId) {
            sb.from('points').select('id')
                .eq('match_id', matchDbId)
                .order('id', { ascending: false })
                .limit(1)
                .then(function(res) {
                    if (res.data && res.data[0]) {
                        sb.from('points').delete().eq('id', res.data[0].id).then(function() {});
                    }
                });
            syncToSupabase();
        }
    }

    function resetSet() {
        if (!state.matchNum || state.matchDone) return;
        if (!confirm('Remettre le set \u00e0 z\u00e9ro?')) return;

        state.aqScore = 0;
        state.advScore = 0;
        state.pointLog = [];
        document.getElementById('scoreAq').textContent = '0';
        document.getElementById('scoreAdv').textContent = '0';
        document.getElementById('pointLogInner').innerHTML = '';
        saveState();

        // Delete points for current set in Supabase
        if (matchDbId) {
            sb.from('points').delete()
                .eq('match_id', matchDbId)
                .eq('set_num', state.currentSet)
                .then(function() {});
            syncToSupabase();
        }
    }

    function switchService() {
        state.serviceAq = !state.serviceAq;
        updateService();
        saveState();
    }

    function updateService() {
        document.getElementById('serviceAq').className = 'service-dot' + (state.serviceAq ? ' active' : '');
        document.getElementById('serviceAdv').className = 'service-dot' + (!state.serviceAq ? ' active' : '');
    }

    // ==========================================
    // UI UPDATES
    // ==========================================
    function updateSetBubbles() {
        var b1 = document.getElementById('set1Bubble');
        var b2 = document.getElementById('set2Bubble');

        b1.className = 'set-bubble';
        b2.className = 'set-bubble';

        if (state.sets.length === 0) {
            b1.classList.add('active');
        } else if (state.sets.length === 1) {
            var s = state.sets[0];
            b1.classList.add(s.aq > s.adv ? 'won' : 'lost');
            b2.classList.add('active');
        } else if (state.sets.length >= 2) {
            var s1 = state.sets[0];
            var s2 = state.sets[1];
            b1.classList.add(s1.aq > s1.adv ? 'won' : 'lost');
            b2.classList.add(s2.aq > s2.adv ? 'won' : 'lost');
        }
    }

    function renderSetHistory() {
        var container = document.getElementById('setHistory');
        container.innerHTML = state.sets.map(function(s, i) {
            var won = s.aq > s.adv;
            return '<div class="set-result">' +
                '<span class="set-name">Set ' + (i + 1) + '</span>' +
                '<span class="set-scores ' + (won ? 'won' : 'lost') + '">' + s.aq + ' - ' + s.adv + '</span>' +
                '<span class="set-winner ' + (won ? 'aq' : 'adv') + '">' + (won ? 'Aquilons' : state.advName) + '</span>' +
            '</div>';
        }).join('');
    }

    function renderPointLog() {
        var inner = document.getElementById('pointLogInner');
        inner.innerHTML = state.pointLog.map(function(p) {
            return '<div class="point-pip ' + (p === 'aq' ? 'aq' : 'adv') + '">' + (p === 'aq' ? 'A' : 'V') + '</div>';
        }).join('');
        inner.scrollTop = inner.scrollHeight;
    }

    function toggleLog() {
        document.getElementById('pointLog').classList.toggle('show');
    }

    function updateDisabledState() {
        var disabled = !state.matchNum || state.matchDone;
        document.getElementById('scoreboard').className = 'scoreboard' + (disabled ? ' disabled' : '');
        document.getElementById('controls').className = 'controls' + (disabled ? ' disabled' : '');
    }

    // ==========================================
    // INIT
    // ==========================================
    loadState();
    updateDisabledState();
</script>

</body>
</html>
