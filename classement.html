<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement - Aquilons Tournoi CVS 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blue: #1A56B8; --blue-light: #3A76D8; --blue-dark: #0E3A80;
            --silver: #A8A9AD; --silver-light: #C8C9CD; --silver-dark: #78797D;
            --bg: #0C1220; --bg-light: #121C30; --bg-card: #101828;
            --gray: #8090A8; --white: #EDF0F5; --win: #4CAF50; --loss: #E53935;
        }
        body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; }
        .header { background: linear-gradient(135deg, var(--bg) 0%, var(--bg-light) 50%, var(--bg) 100%); border-bottom: 3px solid var(--blue); padding: 1.5rem 1rem 1rem; text-align: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(26,86,184,0.08) 0%, transparent 60%); pointer-events: none; }
        .header-logo { width: 80px; height: auto; margin-bottom: 0.3rem; filter: drop-shadow(0 0 15px rgba(26,86,184,0.4)); }
        .team-name { font-family: 'Oswald', sans-serif; font-size: 2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; background: linear-gradient(180deg, var(--silver-light) 0%, var(--silver) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .team-sub { font-family: 'Oswald', sans-serif; font-size: 0.85rem; color: var(--blue-light); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 0.1rem; }
        .nav { display: flex; justify-content: center; background: var(--bg-light); border-bottom: 1px solid rgba(26,86,184,0.2); }
        .nav a { flex: 1; max-width: 200px; text-align: center; padding: 0.8rem 1rem; font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none; color: var(--silver-dark); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .nav a:hover { color: var(--silver-light); }
        .nav a.active { color: var(--blue-light); border-bottom-color: var(--blue); }
        .content { max-width: 600px; margin: 0 auto; padding: 0 1rem 2rem; }
        .pool-card { background: var(--bg-card); border: 1px solid rgba(26,86,184,0.15); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
        .pool-header { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: rgba(26,86,184,0.08); border-bottom: 1px solid rgba(26,86,184,0.15); }
        .pool-name { font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--blue-light); }
        .pool-status { font-size: 0.6rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.1em; }
        .pool-table { width: 100%; border-collapse: collapse; }
        .pool-table th { font-family: 'Oswald', sans-serif; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray); padding: 0.4rem 0.5rem; text-align: center; border-bottom: 1px solid rgba(26,86,184,0.1); }
        .pool-table th:first-child { text-align: left; padding-left: 1rem; }
        .pool-table th.rg { color: var(--blue-light); }
        .pool-table td { font-size: 0.8rem; padding: 0.5rem 0.5rem; text-align: center; border-bottom: 1px solid rgba(26,86,184,0.06); }
        .pool-table td:first-child { text-align: left; padding-left: 1rem; font-weight: 500; }
        .pool-table tr:last-child td { border-bottom: none; }
        .pool-table tr.highlight { background: rgba(26,86,184,0.06); }
        .pool-table tr.highlight td:first-child { color: var(--blue-light); font-weight: 600; }
        .pool-table .rg-cell { font-family: 'Oswald', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--blue-light); }
        .pool-table .ratio { font-size: 0.7rem; color: var(--gray); }
        .pool-table .no-data { color: var(--silver-dark); font-size: 0.7rem; }
        .match-list { padding: 0.5rem 1rem 0.8rem; border-top: 1px solid rgba(26,86,184,0.08); }
        .match-list-title { font-family: 'Oswald', sans-serif; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray); margin-bottom: 0.3rem; }
        .ml-row { display: flex; align-items: center; padding: 0.2rem 0; font-size: 0.7rem; }
        .ml-team { flex: 1; }
        .ml-team.right { text-align: right; }
        .ml-team.aq { color: var(--blue-light); font-weight: 600; }
        .ml-sets { font-family: 'Oswald', sans-serif; font-weight: 600; padding: 0 0.4rem; min-width: 3rem; text-align: center; }
        .ml-sets .w { color: var(--win); }
        .ml-sets .l { color: var(--loss); }
        .ml-detail { color: var(--gray); font-size: 0.6rem; text-align: center; min-width: 5rem; }
        .section-title { font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--blue-light); text-align: center; margin: 1.5rem 0 1rem; display: flex; align-items: center; gap: 1rem; }
        .section-title::before, .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(26,86,184,0.35), transparent); }
        .proj-card { background: var(--bg-card); border: 1px solid rgba(76,175,80,0.25); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        .proj-title { font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--win); margin-bottom: 0.4rem; }
        .proj-line { font-size: 0.8rem; line-height: 1.6; }
        .proj-line .hl { color: var(--blue-light); font-weight: 600; }
        .proj-line .detail { color: var(--gray); font-size: 0.7rem; }
        .bracket-link { display: block; text-align: center; padding: 0.8rem; margin-top: 0.5rem; background: var(--bg-card); border: 1px solid rgba(26,86,184,0.15); border-radius: 10px; color: var(--blue-light); text-decoration: none; font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.2s; }
        .bracket-link:hover { background: rgba(26,86,184,0.1); border-color: rgba(26,86,184,0.4); }
        .refresh-btn { display: block; margin: 1rem auto; padding: 0.5rem 1.5rem; font-family: 'Oswald', sans-serif; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; border-radius: 8px; border: 1px solid rgba(26,86,184,0.2); background: var(--bg-card); color: var(--gray); cursor: pointer; transition: all 0.2s; }
        .refresh-btn:hover { color: var(--white); border-color: rgba(26,86,184,0.4); }
        .last-refresh { text-align: center; font-size: 0.6rem; color: var(--gray); margin-top: 0.3rem; }
        .footer { text-align: center; padding: 2rem 1rem; font-size: 0.7rem; color: rgba(128,144,168,0.4); border-top: 1px solid rgba(26,86,184,0.1); margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.jpg" alt="Aquilons" class="header-logo">
        <div class="team-name">Aquilons</div>
        <div class="team-sub">Classement du tournoi</div>
    </div>
    <div class="nav">
        <a href="index.html">R&eacute;sultats</a>
        <a href="classement.html" class="active">Classement</a>
        <a href="stats.html">Stats</a>
    </div>
    <div class="content">
        <button class="refresh-btn" onclick="fetchAll()">Rafra&icirc;chir les donn&eacute;es</button>
        <div class="last-refresh" id="lastRefresh"></div>
        <div id="projection"></div>
        <div class="section-title">Pools &mdash; Benjamin BF D2</div>
        <div id="poolsD2"></div>
        <div class="section-title">Classement crois&eacute; des 2es</div>
        <div id="crossRanking"></div>
        <div class="section-title">&Eacute;liminatoires &mdash; 8 mars</div>
        <a class="bracket-link" href="https://docs.google.com/spreadsheets/d/1TGb1tBMg2CB9lGfWd3uqxHAcxBW81zw4gSfdKCWH7A0/htmlview#gid=258735679" target="_blank">Tableau Tier 1</a>
        <a class="bracket-link" href="https://docs.google.com/spreadsheets/d/1TGb1tBMg2CB9lGfWd3uqxHAcxBW81zw4gSfdKCWH7A0/htmlview#gid=1190283882" target="_blank" style="margin-top:0.5rem">Tableau Tier 2</a>
    </div>
    <div class="footer">
        Aquilons &middot; Jean de Br&eacute;beuf &middot; Tournoi CVS 2026<br>
        Donn&eacute;es : <a href="https://docs.google.com/spreadsheets/d/1TGb1tBMg2CB9lGfWd3uqxHAcxBW81zw4gSfdKCWH7A0/htmlview" target="_blank" style="color:var(--gray)">Google Sheets officiel</a>
    </div>

<script>
var SHEET_ID = '1TGb1tBMg2CB9lGfWd3uqxHAcxBW81zw4gSfdKCWH7A0';
var GID_D2 = '927908034';
var AQUILON_NAME = 'Aquilon (QC)';

var POOLS_D2 = [
    { name: 'Pool E', ids: [41,42,43,44], teams: ['Express U14 (MAU)', 'Aquilon (QC)', 'CVS U13 Jaune (SAG)', 'Husky JDN (C-N)'] },
    { name: 'Pool F', ids: [51,52,53,54], teams: ['Patriotes (QC)', 'Husky JPG (C-N)', 'ESSOR U13 Noir (QC)', 'Macareux (C-N)'] },
    { name: 'Pool G', ids: [61,62,63,64], teams: ['Phoenix Or (LAN)', 'SELECT 4 (EDQ)', 'Husky JSP (C-N)', 'Ath\u00e9ltiques (QC)'] },
    { name: 'Pool H', ids: [71,72,73,74], teams: ['SELECT 3 (EDQ)', 'CVS U13 Bleu (SAG)', 'Noir et Or (C-N)', 'Husky PG (C-N)'] },
    { name: 'Pool I', ids: [81,82,83,84], teams: ['CVS U13 Blanc (SAG)', 'Impulsives (CHAR)', 'Montagnards 2 (QC)', 'Patriotes 2 (QC)'] }
];

function csvUrl(gid) {
    return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + gid;
}

function parseCSV(text) {
    var lines = [], row = [], field = '', inQuote = false;
    for (var i = 0; i < text.length; i++) {
        var c = text[i];
        if (c === '"') {
            if (inQuote && i + 1 < text.length && text[i + 1] === '"') { field += '"'; i++; }
            else { inQuote = !inQuote; }
        } else if (c === ',' && !inQuote) {
            row.push(field); field = '';
        } else if (c === '\n' && !inQuote) {
            row.push(field); lines.push(row); row = []; field = '';
        } else if (c !== '\r') {
            field += c;
        }
    }
    if (field || row.length) { row.push(field); lines.push(row); }
    return lines;
}

function parsePoolData(rows, pools) {
    // Fixed column positions in the Google Sheets CSV (after proper CSV parsing)
    var SG=16, SP=17, PP=18, PC=19, SGSP=20, PPPC=21, RG=22;
    var data = {};
    pools.forEach(function(pool) {
        data[pool.name] = [];
        pool.teams.forEach(function(team, idx) {
            var teamId = pool.ids[idx];
            for (var r = 0; r < rows.length; r++) {
                var row = rows[r];
                if (row[1] && row[1].trim() === String(teamId)) {
                    var v = function(c) { return row[c] ? row[c].trim() : null; };
                    data[pool.name].push({
                        id: teamId, name: team,
                        sg: v(SG), sp: v(SP), pp: v(PP), pc: v(PC),
                        sgsp: v(SGSP), pppc: v(PPPC), rg: v(RG) || null
                    });
                    break;
                }
            }
            if (!data[pool.name].find(function(e) { return e.name === team; })) {
                data[pool.name].push({ id: teamId, name: team, sg:null, sp:null, pp:null, pc:null, sgsp:null, pppc:null, rg:null });
            }
        });
        // Sort: by RG if available, else by SG desc then PP desc
        data[pool.name].sort(function(a, b) {
            if (a.rg && b.rg) return parseInt(a.rg) - parseInt(b.rg);
            var sgA = parseInt(a.sg) || 0, sgB = parseInt(b.sg) || 0;
            if (sgA !== sgB) return sgB - sgA;
            var ppa = parseInt(a.pp) || 0, ppb = parseInt(b.pp) || 0;
            return ppb - ppa;
        });
    });
    return data;
}

function parseMatchGrid(rows, pool) {
    var matches = [];
    // Find header row with all 4 team IDs
    var colOf = {};
    for (var r = 0; r < rows.length; r++) {
        var found = 0; var tmpCols = {};
        for (var c = 0; c < rows[r].length; c++) {
            var v = (rows[r][c] || '').trim();
            for (var t = 0; t < pool.ids.length; t++) {
                if (v === String(pool.ids[t])) { tmpCols[pool.ids[t]] = c; found++; }
            }
        }
        if (found >= 4) { colOf = tmpCols; break; }
    }
    if (!Object.keys(colOf).length) return matches;

    // Find team data rows (first occurrence only)
    var teamRows = {};
    for (var r = 0; r < rows.length; r++) {
        if (rows[r][1]) {
            var tid = parseInt(rows[r][1].trim());
            if (pool.ids.indexOf(tid) >= 0 && !teamRows[tid]) {
                teamRows[tid] = [rows[r], rows[r + 1] || []];
            }
        }
    }

    // Extract match scores for each pair (upper triangle)
    for (var i = 0; i < pool.ids.length; i++) {
        for (var j = i + 1; j < pool.ids.length; j++) {
            var idA = pool.ids[i], idB = pool.ids[j];
            if (!teamRows[idA]) continue;
            var r1 = teamRows[idA][0], r2 = teamRows[idA][1];
            var col = colOf[idB];
            var s1a = parseInt((r1[col] || '').trim());
            var s1b = parseInt((r1[col + 1] || '').trim());
            var s2a = parseInt((r2[col] || '').trim());
            var s2b = parseInt((r2[col + 1] || '').trim());
            if (!isNaN(s1a) && !isNaN(s1b)) {
                var setsA = 0, setsB = 0;
                if (s1a > s1b) setsA++; else setsB++;
                if (!isNaN(s2a) && !isNaN(s2b)) { if (s2a > s2b) setsA++; else setsB++; }
                matches.push({
                    teamA: pool.teams[i], teamB: pool.teams[j],
                    setsA: setsA, setsB: setsB,
                    scores: !isNaN(s2a) ? s1a+'-'+s1b + ', ' + s2a+'-'+s2b : s1a+'-'+s1b
                });
            }
        }
    }
    return matches;
}

function shortName(name) {
    return name.replace(/\s*\([^)]*\)/, '');
}

function renderPools(pools, data, allMatches, containerId) {
    var container = document.getElementById(containerId);
    container.innerHTML = pools.map(function(pool) {
        var teams = data[pool.name] || pool.teams.map(function(t, i) {
            return { id: pool.ids[i], name: t, sg:null, sp:null, pp:null, pc:null, sgsp:null, pppc:null, rg:null };
        });
        var hasData = teams.some(function(t) { return t.sg !== null; });
        var matches = allMatches[pool.name] || [];
        var totalPossible = 6; // 4 teams = 6 matches
        var status = hasData ? matches.length + '/' + totalPossible + ' matchs' : 'En attente';

        var rows = teams.map(function(t) {
            var isAq = t.name === AQUILON_NAME;
            var cls = isAq ? ' class="highlight"' : '';
            if (!hasData) {
                return '<tr' + cls + '><td>' + shortName(t.name) + '</td><td class="no-data" colspan="5">\u2014</td></tr>';
            }
            return '<tr' + cls + '>' +
                '<td>' + shortName(t.name) + '</td>' +
                '<td>' + (t.sg || '-') + '</td>' +
                '<td>' + (t.sp || '-') + '</td>' +
                '<td>' + (t.pp || '-') + '</td>' +
                '<td>' + (t.pc || '-') + '</td>' +
                '<td class="ratio">' + (t.pppc || '-') + '</td>' +
                '<td class="rg-cell">' + (t.rg || '-') + '</td>' +
                '</tr>';
        }).join('');

        var thExtra = hasData ?
            '<th>SG</th><th>SP</th><th>PP</th><th>PC</th><th>PP/PC</th><th class="rg">Rg</th>' :
            '<th colspan="5"></th>';

        var matchHtml = '';
        if (matches.length > 0) {
            matchHtml = '<div class="match-list"><div class="match-list-title">R\u00e9sultats des matchs</div>';
            matches.forEach(function(m) {
                var isAqA = m.teamA === AQUILON_NAME;
                var isAqB = m.teamB === AQUILON_NAME;
                var clsA = isAqA ? ' aq' : '';
                var clsB = isAqB ? ' aq' : '';
                matchHtml += '<div class="ml-row">' +
                    '<span class="ml-team right' + clsA + '">' + shortName(m.teamA) + '</span>' +
                    '<span class="ml-sets"><span class="' + (m.setsA > m.setsB ? 'w' : m.setsA < m.setsB ? 'l' : '') + '">' + m.setsA + '</span>-<span class="' + (m.setsB > m.setsA ? 'w' : m.setsB < m.setsA ? 'l' : '') + '">' + m.setsB + '</span></span>' +
                    '<span class="ml-team' + clsB + '">' + shortName(m.teamB) + '</span>' +
                    '<span class="ml-detail">(' + m.scores + ')</span>' +
                    '</div>';
            });
            matchHtml += '</div>';
        }

        return '<div class="pool-card">' +
            '<div class="pool-header"><span class="pool-name">' + pool.name + '</span><span class="pool-status">' + status + '</span></div>' +
            '<table class="pool-table"><thead><tr><th>\u00c9quipe</th>' + thExtra + '</tr></thead><tbody>' + rows + '</tbody></table>' +
            matchHtml + '</div>';
    }).join('');
}

function computeCrossRanking(poolData) {
    var seconds = [];
    for (var pName in poolData) {
        var teams = poolData[pName];
        if (teams.length >= 2) {
            var t = teams[1]; // 2nd place (already sorted)
            seconds.push({
                name: t.name, pool: pName,
                sg: parseInt(t.sg) || 0, sp: parseInt(t.sp) || 0,
                pp: parseInt(t.pp) || 0, pc: parseInt(t.pc) || 0,
                pppc: parseFloat((t.pppc || '0').replace(',', '.')) || 0
            });
        }
    }
    seconds.sort(function(a, b) {
        var ra = a.sp > 0 ? a.sg / a.sp : (a.sg > 0 ? 999 : 0);
        var rb = b.sp > 0 ? b.sg / b.sp : (b.sg > 0 ? 999 : 0);
        if (ra !== rb) return rb - ra;
        return b.pppc - a.pppc;
    });
    return seconds;
}

function renderCrossRanking(seconds) {
    var container = document.getElementById('crossRanking');
    if (!seconds.length) { container.innerHTML = ''; return; }

    var labels = ['M2e', '2eM2e', '3eM2e', '4eM2e', '5eM2e'];
    var rows = seconds.map(function(t, i) {
        var isAq = t.name === AQUILON_NAME;
        var cls = isAq ? ' class="highlight"' : '';
        var ratio = t.sp > 0 ? (t.sg / t.sp).toFixed(2) : (t.sg > 0 ? '\u221e' : '0');
        return '<tr' + cls + '>' +
            '<td class="rg-cell">' + (labels[i] || (i+1)) + '</td>' +
            '<td>' + shortName(t.name) + '</td>' +
            '<td class="ratio">' + t.pool.replace('Pool ', '') + '</td>' +
            '<td>' + t.sg + '</td><td>' + t.sp + '</td>' +
            '<td class="ratio">' + ratio + '</td>' +
            '<td class="ratio">' + t.pppc.toFixed(2) + '</td></tr>';
    }).join('');

    container.innerHTML = '<div class="pool-card">' +
        '<table class="pool-table"><thead><tr>' +
        '<th class="rg">Seed</th><th>\u00c9quipe</th><th>Pool</th><th>SG</th><th>SP</th><th>SG/SP</th><th>PP/PC</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderProjection(poolData, seconds) {
    var container = document.getElementById('projection');
    // Find Aquilons
    var aqPool = null, aqRank = -1;
    for (var pName in poolData) {
        var teams = poolData[pName];
        for (var i = 0; i < teams.length; i++) {
            if (teams[i].name === AQUILON_NAME) { aqPool = pName; aqRank = i + 1; break; }
        }
        if (aqPool) break;
    }
    if (!aqPool) { container.innerHTML = ''; return; }

    var seedLabel = '';
    if (aqRank === 1) {
        seedLabel = '1er ' + aqPool.replace('Pool ', '') + ' \u2192 Tier 1 (bye en quart de finale)';
    } else if (aqRank === 2) {
        var crossIdx = -1;
        for (var i = 0; i < seconds.length; i++) {
            if (seconds[i].name === AQUILON_NAME) { crossIdx = i; break; }
        }
        var labels = ['M2e', '2eM2e', '3eM2e', '4eM2e', '5eM2e'];
        seedLabel = (crossIdx >= 0 ? labels[crossIdx] : '?') + ' \u2192 Tier 1';
        if (crossIdx >= 0) seedLabel += ' (huiti\u00e8me de finale)';
    } else if (aqRank === 3) {
        seedLabel = '3e ' + aqPool.replace('Pool ', '') + ' \u2192 Tier 2 probable';
    } else {
        seedLabel = '4e ' + aqPool.replace('Pool ', '') + ' \u2192 Tier 2';
    }

    container.innerHTML = '<div class="proj-card">' +
        '<div class="proj-title">Projection Aquilons</div>' +
        '<div class="proj-line"><span class="hl">' + aqRank + (aqRank===1?'er':'e') + '</span> en ' + aqPool + '</div>' +
        '<div class="proj-line">' + seedLabel + '</div>' +
        '<div class="proj-line detail" style="margin-top:0.3rem;color:var(--gray);font-size:0.7rem">Mise \u00e0 jour auto toutes les 2 min</div>' +
        '</div>';
}

async function fetchSheet(gid) {
    try {
        var res = await fetch(csvUrl(gid));
        var text = await res.text();
        return parseCSV(text);
    } catch(e) {
        console.error('Fetch error for gid ' + gid, e);
        return null;
    }
}

async function fetchAll() {
    document.getElementById('lastRefresh').textContent = 'Chargement...';
    var d2Rows = await fetchSheet(GID_D2);
    var poolData = {};
    var allMatches = {};

    if (d2Rows) {
        poolData = parsePoolData(d2Rows, POOLS_D2);
        POOLS_D2.forEach(function(pool) {
            allMatches[pool.name] = parseMatchGrid(d2Rows, pool);
        });
    }

    renderPools(POOLS_D2, poolData, allMatches, 'poolsD2');

    var seconds = computeCrossRanking(poolData);
    renderCrossRanking(seconds);
    renderProjection(poolData, seconds);

    var now = new Date();
    document.getElementById('lastRefresh').textContent =
        'Derni\u00e8re mise \u00e0 jour : ' + now.getHours() + 'h' + String(now.getMinutes()).padStart(2, '0');
}

renderPools(POOLS_D2, {}, {}, 'poolsD2');
fetchAll();
setInterval(fetchAll, 120000);
</script>
</body>
