<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aquilons - Tournoi CVS 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1A56B8;
            --blue-light: #3A76D8;
            --blue-dark: #0E3A80;
            --silver: #A8A9AD;
            --silver-light: #C8C9CD;
            --silver-dark: #78797D;
            --bg: #0C1220;
            --bg-light: #121C30;
            --bg-card: #101828;
            --gray: #8090A8;
            --white: #EDF0F5;
            --win: #4CAF50;
            --loss: #E53935;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-light) 50%, var(--bg) 100%);
            border-bottom: 3px solid var(--blue);
            padding: 2rem 1rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(26,86,184,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .header-logo {
            width: 120px;
            height: auto;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 20px rgba(26,86,184,0.4));
        }

        .team-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, var(--silver-light) 0%, var(--silver) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .team-sub {
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            color: var(--blue-light);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .tournament-info {
            margin-top: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(26,86,184,0.1);
            border: 1px solid rgba(26,86,184,0.25);
            border-radius: 8px;
            display: inline-block;
        }

        .tournament-info .tourney-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: var(--silver-light);
            letter-spacing: 0.1em;
        }

        .tournament-info .tourney-detail {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        /* NAV */
        .nav {
            display: flex;
            justify-content: center;
            gap: 0;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }

        .nav a {
            flex: 1;
            max-width: 200px;
            text-align: center;
            padding: 0.8rem 1rem;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: var(--silver-dark);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .nav a:hover { color: var(--silver-light); }
        .nav a.active { color: var(--blue-light); border-bottom-color: var(--blue); }

        /* BILAN */
        .bilan {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 1.2rem 1rem;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }

        .bilan-item { text-align: center; }

        .bilan-number {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .bilan-number.wins { color: var(--win); }
        .bilan-number.losses { color: var(--loss); }
        .bilan-number.sets-w { color: var(--blue-light); }
        .bilan-number.sets-l { color: var(--silver-dark); }

        .bilan-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        .bilan-separator {
            width: 1px;
            background: rgba(26,86,184,0.25);
            align-self: stretch;
        }

        /* LIVE SCOREKEEPER */
        .scorekeeper {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 0.8rem 1rem 0;
        }

        .scorekeeper.show { display: block; }

        .sk-match-select {
            text-align: center;
            margin-bottom: 0.8rem;
        }

        .sk-match-select select {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(26,86,184,0.3);
            background: var(--bg-card);
            color: var(--white);
            width: 100%;
            max-width: 400px;
        }

        .sk-panel {
            display: none;
            background: var(--bg-card);
            border: 1px solid rgba(26,86,184,0.25);
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .sk-panel.show { display: block; }

        .sk-set-indicator {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            align-items: center;
        }

        .sk-set-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .sk-set-bubble {
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            border: 2px solid rgba(26,86,184,0.2);
            color: var(--silver-dark);
            background: transparent;
            transition: all 0.3s;
        }

        .sk-set-bubble.active { border-color: var(--blue); color: var(--blue-light); background: rgba(26,86,184,0.1); }
        .sk-set-bubble.won { border-color: var(--win); color: var(--win); background: rgba(76,175,80,0.1); }
        .sk-set-bubble.lost { border-color: var(--loss); color: var(--loss); background: rgba(229,57,53,0.1); }

        .sk-scoreboard {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .sk-side {
            flex: 1;
            text-align: center;
            padding: 0.8rem 0.3rem;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.15s;
        }

        .sk-side:active { transform: scale(0.97); }

        .sk-side.aq {
            background: linear-gradient(180deg, rgba(26,86,184,0.2) 0%, rgba(26,86,184,0.08) 100%);
            border: 2px solid rgba(26,86,184,0.3);
        }

        .sk-side.aq:active { background: linear-gradient(180deg, rgba(26,86,184,0.35) 0%, rgba(26,86,184,0.15) 100%); border-color: var(--blue-light); }

        .sk-side.adv {
            background: linear-gradient(180deg, rgba(168,169,173,0.12) 0%, rgba(168,169,173,0.04) 100%);
            border: 2px solid rgba(168,169,173,0.2);
        }

        .sk-side.adv:active { background: linear-gradient(180deg, rgba(168,169,173,0.25) 0%, rgba(168,169,173,0.1) 100%); border-color: var(--silver); }

        .sk-team-name {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.2rem;
        }

        .sk-side.aq .sk-team-name { color: var(--blue-light); }
        .sk-side.adv .sk-team-name { color: var(--silver); }

        .sk-adv-info {
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            color: var(--gray);
            text-transform: none;
            letter-spacing: 0.02em;
            margin-bottom: 0.2rem;
        }

        .sk-points {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: var(--white);
            text-shadow: 0 2px 15px rgba(0,0,0,0.5);
        }

        .sk-tap-hint {
            font-size: 0.55rem;
            color: var(--gray);
            margin-top: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sk-controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .sk-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(26,86,184,0.2);
            background: var(--bg);
            color: var(--gray);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .sk-btn:active { transform: scale(0.95); }
        .sk-btn:hover { color: var(--white); border-color: rgba(26,86,184,0.4); }
        .sk-btn.danger { border-color: rgba(229,57,53,0.2); }
        .sk-btn.danger:hover { color: var(--loss); border-color: rgba(229,57,53,0.4); }

        .sk-set-history {
            margin-top: 0.5rem;
        }

        .sk-set-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.35rem 0.6rem;
            background: var(--bg);
            border: 1px solid rgba(26,86,184,0.1);
            border-radius: 6px;
            margin-bottom: 0.3rem;
            font-family: 'Oswald', sans-serif;
        }

        .sk-set-result .sn { font-size: 0.7rem; color: var(--gray); width: 2.5rem; }
        .sk-set-result .ss { font-size: 0.95rem; letter-spacing: 0.05em; }
        .sk-set-result .ss.won { color: var(--win); }
        .sk-set-result .ss.lost { color: var(--loss); }
        .sk-set-result .sw {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
        }
        .sk-set-result .sw.aq { background: rgba(76,175,80,0.1); color: var(--win); }
        .sk-set-result .sw.adv { background: rgba(229,57,53,0.1); color: var(--loss); }

        .sk-result-banner {
            display: none;
            text-align: center;
            padding: 0.8rem;
            border-radius: 10px;
            margin-top: 0.5rem;
        }

        .sk-result-banner.show { display: block; }
        .sk-result-banner.win-banner { background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(76,175,80,0.05)); border: 1px solid rgba(76,175,80,0.3); }
        .sk-result-banner.loss-banner { background: linear-gradient(135deg, rgba(229,57,53,0.15), rgba(229,57,53,0.05)); border: 1px solid rgba(229,57,53,0.3); }

        .sk-result-banner .rt {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .win-banner .rt { color: var(--win); }
        .loss-banner .rt { color: var(--loss); }

        .sk-result-banner .rd {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        .sk-sync {
            text-align: center;
            padding: 0.2rem;
            font-size: 0.55rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sk-sync.connected { color: var(--win); }
        .sk-sync.error { color: var(--loss); }

        .sk-scoreboard.disabled .sk-side { pointer-events: none; opacity: 0.4; }
        .sk-controls.disabled .sk-btn { pointer-events: none; opacity: 0.4; }

        /* MATCHES */
        .matches {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--blue-light);
            text-align: center;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::before,
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(26,86,184,0.35), transparent);
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid rgba(26,86,184,0.15);
            border-radius: 10px;
            margin-bottom: 0.8rem;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .match-card:hover { border-color: rgba(26,86,184,0.4); }
        .match-card.win { border-left: 3px solid var(--win); }
        .match-card.loss { border-left: 3px solid var(--loss); }
        .match-card.upcoming { border-left: 3px solid var(--silver-dark); opacity: 0.7; }

        .match-card.live {
            border-left: 3px solid var(--blue);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(26,86,184,0); }
            50% { box-shadow: 0 0 15px 0 rgba(26,86,184,0.2); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem 0.3rem;
        }

        .match-time {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--silver-light);
        }

        .match-badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-win { background: rgba(76,175,80,0.15); color: var(--win); }
        .badge-loss { background: rgba(229,57,53,0.15); color: var(--loss); }
        .badge-upcoming { background: rgba(168,169,173,0.1); color: var(--silver-dark); }

        .badge-live {
            background: rgba(26,86,184,0.2);
            color: var(--blue-light);
            animation: pulse-text 1.5s infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .match-body {
            display: flex;
            align-items: center;
            padding: 0.3rem 1rem 0.7rem;
            gap: 0.8rem;
        }

        .match-teams { flex: 1; }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.2rem 0;
        }

        .team-label { font-size: 0.9rem; font-weight: 500; }
        .team-label.is-aquilon { color: var(--blue-light); font-weight: 600; }

        .set-scores { display: flex; gap: 0.4rem; align-items: center; }

        .set-score {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            width: 2rem;
            text-align: center;
            color: var(--white);
        }

        .set-score.won { color: var(--blue-light); font-weight: 700; }
        .set-score.lost { color: var(--silver-dark); }

        .set-score.live-score {
            color: var(--blue-light);
            font-weight: 700;
            animation: pulse-text 1.5s infinite;
        }

        .match-location {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.4rem 1rem 0.7rem;
            font-size: 0.7rem;
            color: var(--gray);
        }

        .match-location .pin { font-size: 0.85rem; flex-shrink: 0; margin-top: 0.05rem; }

        .match-location .loc-info { flex: 1; }

        .match-location .loc-venue {
            font-size: 0.8rem;
            color: var(--silver-light);
            font-weight: 500;
        }

        .match-location .loc-addr {
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 0.1rem;
        }

        .match-location .loc-map {
            display: inline-block;
            margin-top: 0.3rem;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--blue-light);
            text-decoration: none;
            padding: 0.2rem 0.5rem;
            border: 1px solid rgba(58,118,216,0.3);
            border-radius: 4px;
            transition: all 0.2s;
        }

        .match-location .loc-map:hover {
            background: rgba(26,86,184,0.15);
            border-color: var(--blue-light);
        }

        .team-info {
            font-size: 0.65rem;
            color: var(--gray);
            margin-left: 0.3rem;
            font-weight: 400;
        }

        .match-live-score {
            padding: 0 1rem 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--blue-light);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.7rem;
            color: rgba(128,144,168,0.4);
            border-top: 1px solid rgba(26,86,184,0.1);
            margin-top: 1rem;
        }

        .last-update {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: var(--gray);
            background: rgba(26,86,184,0.06);
            border-radius: 6px;
            margin: 1rem 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <img src="logo.jpg" alt="Aquilons Br&eacute;beuf" class="header-logo">
        <div class="team-name">Aquilons</div>
        <div class="team-sub">Jean de Br&eacute;beuf &middot; Benjamin D2</div>
        <div class="tournament-info">
            <div class="tourney-name">Tournoi CVS 2026</div>
            <div class="tourney-detail">Alma &middot; 7 mars 2026 &middot; 2 sets de 25 pts</div>
        </div>
    </div>

    <div class="nav">
        <a href="index.html" class="active">R&eacute;sultats</a>
        <a href="classement.html">Classement</a>
    </div>

    <!-- BILAN -->
    <div class="bilan">
        <div class="bilan-item">
            <div class="bilan-number wins" id="bilanWins">-</div>
            <div class="bilan-label">Victoires</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number losses" id="bilanLosses">-</div>
            <div class="bilan-label">D&eacute;faites</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number sets-w" id="bilanSetsW">-</div>
            <div class="bilan-label">Sets gagn&eacute;s</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number sets-l" id="bilanSetsL">-</div>
            <div class="bilan-label">Sets perdus</div>
        </div>
    </div>

    <!-- SCOREKEEPER -->
    <div class="scorekeeper" id="scorekeeper">
        <div class="sk-match-select">
            <select id="skMatchSelect" onchange="skSelectMatch()">
                <option value="">-- Marquer un match --</option>
                <option value="1" data-adv="Husky JDN" data-time="9h30">Match 1 - 9h30 vs Husky JDN</option>
                <option value="2" data-adv="Bleu et Or" data-time="10h30">Match 2 - 10h30 vs Bleu et Or</option>
                <option value="3" data-adv="Express U14" data-time="11h30">Match 3 - 11h30 vs Express U14</option>
                <option value="4" data-adv="Les Condors" data-time="14h30">Match 4 - 14h30 vs Les Condors</option>
                <option value="5" data-adv="Bleu et Or" data-time="16h30">Match 5 - 16h30 vs Bleu et Or</option>
                <option value="6" data-adv="Tigres d'Am&eacute;" data-time="17h30">Match 6 - 17h30 vs Tigres d'Am&eacute;</option>
                <option value="7" data-adv="Husky KS" data-time="19h30">Match 7 - 19h30 vs Husky KS</option>
            </select>
        </div>
        <div class="sk-panel" id="skPanel">
            <div class="sk-set-indicator">
                <span class="sk-set-label">Sets</span>
                <div class="sk-set-bubble active" id="skBub1">1</div>
                <div class="sk-set-bubble" id="skBub2">2</div>
            </div>
            <div class="sk-scoreboard" id="skScoreboard">
                <div class="sk-side aq" onclick="skPoint('aq')">
                    <div class="sk-team-name">Aquilons</div>
                    <div class="sk-points" id="skScoreAq">0</div>
                    <div class="sk-tap-hint">Toucher = +1</div>
                </div>
                <div class="sk-side adv" onclick="skPoint('adv')">
                    <div class="sk-team-name" id="skAdvName">Adversaire</div>
                    <div class="sk-adv-info" id="skAdvInfo"></div>
                    <div class="sk-points" id="skScoreAdv">0</div>
                    <div class="sk-tap-hint">Toucher = +1</div>
                </div>
            </div>
            <div class="sk-controls" id="skControls">
                <button class="sk-btn danger" onclick="skUndo()">Annuler</button>
                <button class="sk-btn" onclick="skResetSet()">Reset set</button>
            </div>
            <div class="sk-set-history" id="skSetHistory"></div>
            <div class="sk-result-banner" id="skResult"></div>
            <div class="sk-sync" id="skSync"></div>
        </div>
    </div>

    <!-- MATCHS -->
    <div class="matches">
        <div class="section-title">Matchs du jour</div>
        <div class="last-update" id="lastUpdate">Chargement...</div>
        <div id="matchsContainer"></div>
    </div>

    <div class="footer">
        Aquilons &middot; Jean de Br&eacute;beuf &middot; Tournoi CVS 2026
    </div>

<script>
    // ==========================================
    // SUPABASE INIT
    // ==========================================
    var SUPABASE_URL = 'https://rtbmpcitrymeqzpjwneh.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0Ym1wY2l0cnltZXF6cGp3bmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NDgyOTEsImV4cCI6MjA4ODQyNDI5MX0.6qvaCDLDiCX4KZLJHK1_JiPHROoCtiiEQjsBJbS4CiU';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var TOURNOI_ID = 'a0000000-0000-0000-0000-000000000001';

    var adversairesMap = {};

    // ==========================================
    // ADVERSAIRES
    // ==========================================
    async function loadAdversaires() {
        var res = await sb.from('adversaires').select('nom_tournoi,region_rseq,rang_regional').eq('tournoi_id', TOURNOI_ID);
        if (res.data) res.data.forEach(function(a) { adversairesMap[a.nom_tournoi] = a; });
    }

    function advInfoHtml(nom) {
        var a = adversairesMap[nom];
        if (!a) return '';
        var parts = [];
        if (a.region_rseq) parts.push(a.region_rseq);
        if (a.rang_regional) parts.push(a.rang_regional + (a.rang_regional === 1 ? 'er' : 'e') + ' r\u00e9gional');
        return parts.length ? '<span class="team-info"> \u2014 ' + parts.join(' \u00b7 ') + '</span>' : '';
    }

    function advInfoText(nom) {
        var a = adversairesMap[nom];
        if (!a) return '';
        var parts = [];
        if (a.region_rseq) parts.push(a.region_rseq);
        if (a.rang_regional) parts.push(a.rang_regional + (a.rang_regional === 1 ? 'er' : 'e') + ' r\u00e9gional');
        return parts.join(' \u00b7 ');
    }

    // ==========================================
    // MATCH LIST (spectator view)
    // ==========================================
    async function loadMatchs() {
        var res = await sb.from('matchs').select('*').eq('tournoi_id', TOURNOI_ID).order('numero');
        if (!res.data) return;
        renderMatchs(res.data);
        updateBilan(res.data);
    }

    var venueAddresses = {
        'Centre Mario-Tremblay': '605 Boul. Saint-Luc O, Alma',
        '\u00c9cole Jean-Gauthier': '441 rue Joseph-W.-Fleury, Alma',
        'Camille-Lavoie': '500 Av. des M\u00e9tiers, Alma'
    };

    function scoreCell(aqScore, advScore) {
        if (aqScore == null) return { aq: '-', adv: '-', aqCls: '', advCls: '' };
        var won = aqScore > advScore;
        return { aq: aqScore, adv: advScore, aqCls: won ? 'won' : 'lost', advCls: won ? 'lost' : 'won' };
    }

    function renderMatchs(matchs) {
        var container = document.getElementById('matchsContainer');
        var statusMap = {
            win:  { cls: 'win', badge: 'badge-win', text: 'Victoire' },
            loss: { cls: 'loss', badge: 'badge-loss', text: 'D\u00e9faite' },
            live: { cls: 'live', badge: 'badge-live', text: '\u25CF En cours' }
        };
        var defaultSt = { cls: 'upcoming', badge: 'badge-upcoming', text: '\u00c0 venir' };

        container.innerHTML = matchs.map(function(m) {
            var st = statusMap[m.statut] || defaultSt;
            var s1 = scoreCell(m.aq_set1, m.adv_set1);
            var s2 = scoreCell(m.aq_set2, m.adv_set2);

            // For live match, show current score as a third column
            var liveCol = '';
            if (m.statut === 'live' && m.set_courant > 0) {
                liveCol =
                    '<span class="set-score live-score">' + m.aq_score_courant + '</span>';
                var liveColAdv =
                    '<span class="set-score live-score">' + m.adv_score_courant + '</span>';
            }

            var liveInfo = '';
            if (m.statut === 'live' && m.set_courant > 0) {
                liveInfo = '<div class="match-live-score">Set ' + m.set_courant + ' en cours</div>';
            }

            return '<div class="match-card ' + st.cls + '">' +
                '<div class="match-header">' +
                    '<span class="match-time">' + m.heure + '</span>' +
                    '<span class="match-badge ' + st.badge + '">' + st.text + '</span>' +
                '</div>' +
                '<div class="match-body"><div class="match-teams">' +
                    '<div class="team-row">' +
                        '<span class="team-label is-aquilon">Aquilons</span>' +
                        '<div class="set-scores">' +
                            '<span class="set-score ' + s1.aqCls + '">' + s1.aq + '</span>' +
                            '<span class="set-score ' + s2.aqCls + '">' + s2.aq + '</span>' +
                            (liveCol || '') +
                        '</div>' +
                    '</div>' +
                    '<div class="team-row">' +
                        '<span class="team-label">' + m.adversaire + advInfoHtml(m.adversaire) + '</span>' +
                        '<div class="set-scores">' +
                            '<span class="set-score ' + s1.advCls + '">' + s1.adv + '</span>' +
                            '<span class="set-score ' + s2.advCls + '">' + s2.adv + '</span>' +
                            (liveColAdv || '') +
                        '</div>' +
                    '</div>' +
                '</div></div>' +
                liveInfo +
                '<div class="match-location">' +
                    '<span class="pin">&#128205;</span>' +
                    '<div class="loc-info">' +
                        '<div class="loc-venue">' + m.lieu_nom + ' &mdash; ' + m.terrain + '</div>' +
                        '<div class="loc-addr">' + (venueAddresses[m.lieu_nom] || '') + '</div>' +
                        '<a href="' + m.lieu_maps_url + '" target="_blank" class="loc-map">Ouvrir dans Maps</a>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }).join('');

        var updateEl = document.getElementById('lastUpdate');
        var live = matchs.find(function(m) { return m.statut === 'live'; });
        var played = matchs.filter(function(m) { return m.statut === 'win' || m.statut === 'loss'; }).length;
        if (live) {
            updateEl.textContent = 'En cours : vs ' + live.adversaire + ' (Set ' + live.set_courant + ' : ' + live.aq_score_courant + '-' + live.adv_score_courant + ')';
        } else if (played > 0) {
            updateEl.textContent = played + '/' + matchs.length + ' matchs jou\u00e9s';
        } else {
            updateEl.textContent = 'En attente du premier match';
        }
    }

    function updateBilan(matchs) {
        var wins = 0, losses = 0, setsW = 0, setsL = 0;
        matchs.forEach(function(m) {
            if (m.statut === 'win') wins++;
            if (m.statut === 'loss') losses++;
            if (m.aq_set1 != null && m.adv_set1 != null) { m.aq_set1 > m.adv_set1 ? setsW++ : setsL++; }
            if (m.aq_set2 != null && m.adv_set2 != null) { m.aq_set2 > m.adv_set2 ? setsW++ : setsL++; }
        });
        document.getElementById('bilanWins').textContent = wins;
        document.getElementById('bilanLosses').textContent = losses;
        document.getElementById('bilanSetsW').textContent = setsW;
        document.getElementById('bilanSetsL').textContent = setsL;
    }

    // ==========================================
    // SCOREKEEPER STATE
    // ==========================================
    var sk = {
        matchNum: null,
        advName: '',
        currentSet: 1,
        aqScore: 0,
        advScore: 0,
        sets: [],
        pointLog: [],
        matchDone: false,
        setTimestamps: { set1_debut: null, set1_fin: null, set2_debut: null, set2_fin: null }
    };

    var matchDbId = null;
    var SK_KEY = 'aquilons-match-state';

    function skSave() {
        try { localStorage.setItem(SK_KEY, JSON.stringify(sk)); } catch(e) {}
    }

    function skLoad() {
        try {
            var s = localStorage.getItem(SK_KEY);
            if (s) {
                sk = JSON.parse(s);
                if (sk.matchNum) {
                    document.getElementById('skMatchSelect').value = sk.matchNum;
                    document.getElementById('skAdvName').textContent = sk.advName;
                    document.getElementById('skAdvInfo').textContent = advInfoText(sk.advName);
                    document.getElementById('skPanel').classList.add('show');
                    skApplyUI();
                    sb.from('matchs').select('id')
                        .eq('tournoi_id', TOURNOI_ID)
                        .eq('numero', parseInt(sk.matchNum))
                        .single()
                        .then(function(res) { if (res.data) matchDbId = res.data.id; });
                }
            }
        } catch(e) {}
    }

    // ==========================================
    // SCOREKEEPER UI
    // ==========================================
    function skApplyUI() {
        document.getElementById('skScoreAq').textContent = sk.aqScore;
        document.getElementById('skScoreAdv').textContent = sk.advScore;
        skUpdateBubbles();
        skRenderSetHistory();
        if (sk.matchDone) skShowResult();
        skUpdateDisabled();
    }

    function skUpdateBubbles() {
        var b1 = document.getElementById('skBub1');
        var b2 = document.getElementById('skBub2');
        b1.className = 'sk-set-bubble';
        b2.className = 'sk-set-bubble';
        if (sk.sets.length === 0) {
            b1.classList.add('active');
        } else if (sk.sets.length === 1) {
            b1.classList.add(sk.sets[0].aq > sk.sets[0].adv ? 'won' : 'lost');
            b2.classList.add('active');
        } else {
            b1.classList.add(sk.sets[0].aq > sk.sets[0].adv ? 'won' : 'lost');
            b2.classList.add(sk.sets[1].aq > sk.sets[1].adv ? 'won' : 'lost');
        }
    }

    function setDuration(setNum) {
        var ts = sk.setTimestamps || {};
        var debut = ts['set' + setNum + '_debut'];
        var fin = ts['set' + setNum + '_fin'];
        if (!debut || !fin) return '';
        var ms = new Date(fin) - new Date(debut);
        var mins = Math.floor(ms / 60000);
        var secs = Math.floor((ms % 60000) / 1000);
        return mins + ':' + String(secs).padStart(2, '0');
    }

    function skRenderSetHistory() {
        document.getElementById('skSetHistory').innerHTML = sk.sets.map(function(s, i) {
            var won = s.aq > s.adv;
            var dur = setDuration(i + 1);
            var durHtml = dur ? ' <span style="font-size:0.6rem;color:var(--gray);font-weight:400">(' + dur + ')</span>' : '';
            return '<div class="sk-set-result">' +
                '<span class="sn">Set ' + (i + 1) + '</span>' +
                '<span class="ss ' + (won ? 'won' : 'lost') + '">' + s.aq + ' - ' + s.adv + durHtml + '</span>' +
                '<span class="sw ' + (won ? 'aq' : 'adv') + '">' + (won ? 'Aquilons' : sk.advName) + '</span>' +
            '</div>';
        }).join('');
    }

    function skUpdateDisabled() {
        var disabled = !sk.matchNum || sk.matchDone;
        document.getElementById('skScoreboard').className = 'sk-scoreboard' + (disabled ? ' disabled' : '');
        document.getElementById('skControls').className = 'sk-controls' + (disabled ? ' disabled' : '');
    }

    function skSetSync(text, cls) {
        var el = document.getElementById('skSync');
        el.textContent = text;
        el.className = 'sk-sync ' + (cls || '');
    }

    // ==========================================
    // SCOREKEEPER SYNC
    // ==========================================
    function skSync() {
        if (!matchDbId) return;
        var ts = sk.setTimestamps || {};
        var updates = {
            aq_score_courant: sk.aqScore,
            adv_score_courant: sk.advScore,
            set_courant: sk.currentSet,
            aq_set1: sk.sets.length >= 1 ? sk.sets[0].aq : null,
            adv_set1: sk.sets.length >= 1 ? sk.sets[0].adv : null,
            aq_set2: sk.sets.length >= 2 ? sk.sets[1].aq : null,
            adv_set2: sk.sets.length >= 2 ? sk.sets[1].adv : null,
            set1_debut: ts.set1_debut || null,
            set1_fin: ts.set1_fin || null,
            set2_debut: ts.set2_debut || null,
            set2_fin: ts.set2_fin || null
        };
        if (sk.matchDone) {
            var setsWon = sk.sets.filter(function(s) { return s.aq > s.adv; }).length;
            updates.statut = setsWon > sk.sets.length - setsWon ? 'win' : 'loss';
            updates.set_courant = 0;
        } else {
            updates.statut = 'live';
        }
        sb.from('matchs').update(updates).eq('id', matchDbId).then(function(res) {
            if (res.error) skSetSync('Erreur sync', 'error');
            else skSetSync('Sync OK', 'connected');
        });
    }

    // ==========================================
    // SCOREKEEPER ACTIONS
    // ==========================================
    function skSelectMatch() {
        var sel = document.getElementById('skMatchSelect');
        var opt = sel.options[sel.selectedIndex];
        if (!opt.value) {
            document.getElementById('skPanel').classList.remove('show');
            return;
        }

        sk = {
            matchNum: opt.value,
            advName: opt.dataset.adv,
            currentSet: 1,
            aqScore: 0,
            advScore: 0,
            sets: [],
            pointLog: [],
            matchDone: false,
            setTimestamps: { set1_debut: null, set1_fin: null, set2_debut: null, set2_fin: null }
        };

        document.getElementById('skAdvName').textContent = sk.advName;
        document.getElementById('skAdvInfo').textContent = advInfoText(sk.advName);
        document.getElementById('skScoreAq').textContent = '0';
        document.getElementById('skScoreAdv').textContent = '0';
        document.getElementById('skSetHistory').innerHTML = '';
        document.getElementById('skResult').className = 'sk-result-banner';
        document.getElementById('skResult').innerHTML = '';
        document.getElementById('skPanel').classList.add('show');
        skUpdateBubbles();
        skUpdateDisabled();
        skSave();

        sb.from('matchs').select('id')
            .eq('tournoi_id', TOURNOI_ID)
            .eq('numero', parseInt(opt.value))
            .single()
            .then(function(res) {
                if (res.data) {
                    matchDbId = res.data.id;
                    sb.from('points').delete().eq('match_id', matchDbId).then(function() { skSync(); });
                }
            });
    }

    function skPoint(team) {
        if (!sk.matchNum || sk.matchDone) return;
        if (sk.currentSet > 2) return;

        // Record set start on first point
        var tsKey = 'set' + sk.currentSet + '_debut';
        if (!sk.setTimestamps[tsKey]) {
            sk.setTimestamps[tsKey] = new Date().toISOString();
        }

        if (team === 'aq') sk.aqScore++;
        else sk.advScore++;
        sk.pointLog.push(team);

        document.getElementById('skScoreAq').textContent = sk.aqScore;
        document.getElementById('skScoreAdv').textContent = sk.advScore;

        if (matchDbId) {
            sb.from('points').insert({
                match_id: matchDbId,
                set_num: sk.currentSet,
                equipe: team,
                aq_score: sk.aqScore,
                adv_score: sk.advScore
            }).then(function() {});
        }

        skCheckSetEnd();
        skSave();
        skSync();
    }

    function skCheckSetEnd() {
        var aq = sk.aqScore, adv = sk.advScore;
        if ((aq >= 25 || adv >= 25) && Math.abs(aq - adv) >= 2) {
            // Record set end time
            sk.setTimestamps['set' + sk.currentSet + '_fin'] = new Date().toISOString();
            sk.sets.push({ aq: aq, adv: adv });
            skRenderSetHistory();
            skUpdateBubbles();

            if (sk.sets.length >= 2) {
                sk.matchDone = true;
                skShowResult();
                skUpdateDisabled();
            } else {
                sk.currentSet = 2;
                sk.aqScore = 0;
                sk.advScore = 0;
                sk.pointLog = [];
                document.getElementById('skScoreAq').textContent = '0';
                document.getElementById('skScoreAdv').textContent = '0';
                skUpdateBubbles();
            }
        }
    }

    function skShowResult() {
        var setsWon = sk.sets.filter(function(s) { return s.aq > s.adv; }).length;
        var won = setsWon > sk.sets.length - setsWon;
        var banner = document.getElementById('skResult');
        banner.className = 'sk-result-banner show ' + (won ? 'win-banner' : 'loss-banner');
        var d1 = setDuration(1), d2 = setDuration(2);
        var d1t = d1 ? ' (' + d1 + ')' : '', d2t = d2 ? ' (' + d2 + ')' : '';
        banner.innerHTML =
            '<div class="rt">' + (won ? 'Victoire!' : 'D\u00e9faite') + '</div>' +
            '<div class="rd">Set 1: ' + sk.sets[0].aq + '-' + sk.sets[0].adv + d1t +
            ' \u00b7 Set 2: ' + sk.sets[1].aq + '-' + sk.sets[1].adv + d2t + '</div>';
    }

    function skUndo() {
        if (!sk.matchNum || sk.matchDone || sk.pointLog.length === 0) return;
        var last = sk.pointLog.pop();
        if (last === 'aq') sk.aqScore = Math.max(0, sk.aqScore - 1);
        else sk.advScore = Math.max(0, sk.advScore - 1);
        document.getElementById('skScoreAq').textContent = sk.aqScore;
        document.getElementById('skScoreAdv').textContent = sk.advScore;
        skSave();

        if (matchDbId) {
            sb.from('points').select('id')
                .eq('match_id', matchDbId)
                .order('id', { ascending: false })
                .limit(1)
                .then(function(res) {
                    if (res.data && res.data[0]) sb.from('points').delete().eq('id', res.data[0].id).then(function() {});
                });
            skSync();
        }
    }

    function skResetSet() {
        if (!sk.matchNum || sk.matchDone) return;
        if (!confirm('Remettre le set \u00e0 z\u00e9ro?')) return;
        sk.aqScore = 0;
        sk.advScore = 0;
        sk.pointLog = [];
        sk.setTimestamps['set' + sk.currentSet + '_debut'] = null;
        sk.setTimestamps['set' + sk.currentSet + '_fin'] = null;
        document.getElementById('skScoreAq').textContent = '0';
        document.getElementById('skScoreAdv').textContent = '0';
        skSave();

        if (matchDbId) {
            sb.from('points').delete().eq('match_id', matchDbId).eq('set_num', sk.currentSet).then(function() {});
            skSync();
        }
    }

    // ==========================================
    // REALTIME
    // ==========================================
    sb.channel('matchs-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'matchs' }, function() { loadMatchs(); })
        .subscribe();

    // ==========================================
    // INIT
    // ==========================================
    // Show scorekeeper if URL has ?score param
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('score')) {
        document.getElementById('scorekeeper').classList.add('show');
    }

    loadAdversaires().then(function() {
        loadMatchs();
        skLoad();
    });
</script>

</body>
</html>
