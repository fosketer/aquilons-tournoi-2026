<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquilons - Tournoi CVS 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1A56B8;
            --blue-light: #3A76D8;
            --blue-dark: #0E3A80;
            --silver: #A8A9AD;
            --silver-light: #C8C9CD;
            --silver-dark: #78797D;
            --bg: #0C1220;
            --bg-light: #121C30;
            --bg-card: #101828;
            --gray: #8090A8;
            --white: #EDF0F5;
            --win: #4CAF50;
            --loss: #E53935;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-light) 50%, var(--bg) 100%);
            border-bottom: 3px solid var(--blue);
            padding: 2rem 1rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(26,86,184,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .header-logo {
            width: 120px;
            height: auto;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 20px rgba(26,86,184,0.4));
        }

        .team-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, var(--silver-light) 0%, var(--silver) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .team-sub {
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            color: var(--blue-light);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .tournament-info {
            margin-top: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(26,86,184,0.1);
            border: 1px solid rgba(26,86,184,0.25);
            border-radius: 8px;
            display: inline-block;
        }

        .tournament-info .tourney-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: var(--silver-light);
            letter-spacing: 0.1em;
        }

        .tournament-info .tourney-detail {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        /* NAV */
        .nav {
            display: flex;
            justify-content: center;
            gap: 0;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }

        .nav a {
            flex: 1;
            max-width: 200px;
            text-align: center;
            padding: 0.8rem 1rem;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: var(--silver-dark);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .nav a:hover {
            color: var(--silver-light);
        }

        .nav a.active {
            color: var(--blue-light);
            border-bottom-color: var(--blue);
        }

        /* BILAN */
        .bilan {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 1.2rem 1rem;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }

        .bilan-item {
            text-align: center;
        }

        .bilan-number {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .bilan-number.wins { color: var(--win); }
        .bilan-number.losses { color: var(--loss); }
        .bilan-number.sets-w { color: var(--blue-light); }
        .bilan-number.sets-l { color: var(--silver-dark); }

        .bilan-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        .bilan-separator {
            width: 1px;
            background: rgba(26,86,184,0.25);
            align-self: stretch;
        }

        /* MATCHES */
        .matches {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--blue-light);
            text-align: center;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::before,
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(26,86,184,0.35), transparent);
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid rgba(26,86,184,0.15);
            border-radius: 10px;
            margin-bottom: 0.8rem;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .match-card:hover {
            border-color: rgba(26,86,184,0.4);
        }

        .match-card.win {
            border-left: 3px solid var(--win);
        }

        .match-card.loss {
            border-left: 3px solid var(--loss);
        }

        .match-card.upcoming {
            border-left: 3px solid var(--silver-dark);
            opacity: 0.7;
        }

        .match-card.live {
            border-left: 3px solid var(--blue);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(26,86,184,0); }
            50% { box-shadow: 0 0 15px 0 rgba(26,86,184,0.2); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem 0.3rem;
        }

        .match-time {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--silver-light);
        }

        .match-badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-win {
            background: rgba(76,175,80,0.15);
            color: var(--win);
        }

        .badge-loss {
            background: rgba(229,57,53,0.15);
            color: var(--loss);
        }

        .badge-upcoming {
            background: rgba(168,169,173,0.1);
            color: var(--silver-dark);
        }

        .badge-live {
            background: rgba(26,86,184,0.2);
            color: var(--blue-light);
            animation: pulse-text 1.5s infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .match-body {
            display: flex;
            align-items: center;
            padding: 0.3rem 1rem 0.7rem;
            gap: 0.8rem;
        }

        .match-teams {
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.2rem 0;
        }

        .team-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .team-label.is-aquilon {
            color: var(--blue-light);
            font-weight: 600;
        }

        .set-scores {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .set-score {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            width: 2rem;
            text-align: center;
            color: var(--white);
        }

        .set-score.won {
            color: var(--blue-light);
            font-weight: 700;
        }

        .set-score.lost {
            color: var(--silver-dark);
        }

        .match-location {
            padding: 0 1rem 0.6rem;
            font-size: 0.7rem;
            color: var(--gray);
        }

        .match-location a {
            color: var(--gray);
            text-decoration: none;
            border-bottom: 1px dotted rgba(128,144,168,0.4);
        }

        .match-location a:hover {
            color: var(--blue-light);
        }

        .match-live-score {
            padding: 0 1rem 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--blue-light);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.7rem;
            color: rgba(128,144,168,0.4);
            border-top: 1px solid rgba(26,86,184,0.1);
            margin-top: 1rem;
        }

        .last-update {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: var(--gray);
            background: rgba(26,86,184,0.06);
            border-radius: 6px;
            margin: 1rem 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <img src="logo.jpg" alt="Aquilons Br&eacute;beuf" class="header-logo">
        <div class="team-name">Aquilons</div>
        <div class="team-sub">Jean de Br&eacute;beuf &middot; Benjamin D2</div>
        <div class="tournament-info">
            <div class="tourney-name">Tournoi CVS 2026</div>
            <div class="tourney-detail">Alma &middot; 7 mars 2026 &middot; 2 sets de 25 pts</div>
        </div>
    </div>

    <div class="nav">
        <a href="index.html" class="active">R&eacute;sultats</a>
        <a href="horaire.html">Horaire</a>
        <a href="match.html">Match</a>
    </div>

    <!-- BILAN -->
    <div class="bilan">
        <div class="bilan-item">
            <div class="bilan-number wins" id="bilanWins">-</div>
            <div class="bilan-label">Victoires</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number losses" id="bilanLosses">-</div>
            <div class="bilan-label">D&eacute;faites</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number sets-w" id="bilanSetsW">-</div>
            <div class="bilan-label">Sets gagn&eacute;s</div>
        </div>
        <div class="bilan-separator"></div>
        <div class="bilan-item">
            <div class="bilan-number sets-l" id="bilanSetsL">-</div>
            <div class="bilan-label">Sets perdus</div>
        </div>
    </div>

    <!-- MATCHS -->
    <div class="matches">
        <div class="section-title">Matchs du jour</div>
        <div class="last-update" id="lastUpdate">Chargement...</div>
        <div id="matchsContainer"></div>
    </div>

    <div class="footer">
        Aquilons &middot; Jean de Br&eacute;beuf &middot; Tournoi CVS 2026
    </div>

<script>
    const SUPABASE_URL = 'https://rtbmpcitrymeqzpjwneh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0Ym1wY2l0cnltZXF6cGp3bmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NDgyOTEsImV4cCI6MjA4ODQyNDI5MX0.6qvaCDLDiCX4KZLJHK1_JiPHROoCtiiEQjsBJbS4CiU';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const TOURNOI_ID = 'a0000000-0000-0000-0000-000000000001';

    async function loadMatchs() {
        const { data } = await sb.from('matchs').select('*').eq('tournoi_id', TOURNOI_ID).order('numero');
        if (!data) return;
        renderMatchs(data);
        updateBilan(data);
    }

    function scoreCell(aqScore, advScore) {
        if (aqScore == null) return { aq: '-', adv: '-', aqCls: '', advCls: '' };
        const won = aqScore > advScore;
        return { aq: aqScore, adv: advScore, aqCls: won ? 'won' : 'lost', advCls: won ? 'lost' : 'won' };
    }

    function renderMatchs(matchs) {
        const container = document.getElementById('matchsContainer');
        const statusMap = {
            win:  { cls: 'win', badge: 'badge-win', text: 'Victoire' },
            loss: { cls: 'loss', badge: 'badge-loss', text: 'D\u00e9faite' },
            live: { cls: 'live', badge: 'badge-live', text: '\u25CF En cours' }
        };
        const defaultSt = { cls: 'upcoming', badge: 'badge-upcoming', text: '\u00c0 venir' };

        container.innerHTML = matchs.map(function(m) {
            var st = statusMap[m.statut] || defaultSt;
            var s1 = scoreCell(m.aq_set1, m.adv_set1);
            var s2 = scoreCell(m.aq_set2, m.adv_set2);

            var liveInfo = '';
            if (m.statut === 'live' && m.set_courant > 0) {
                liveInfo = '<div class="match-live-score">Set ' + m.set_courant + ' en cours : ' + m.aq_score_courant + ' - ' + m.adv_score_courant + '</div>';
            }

            return '<div class="match-card ' + st.cls + '">' +
                '<div class="match-header">' +
                    '<span class="match-time">' + m.heure + '</span>' +
                    '<span class="match-badge ' + st.badge + '">' + st.text + '</span>' +
                '</div>' +
                '<div class="match-body"><div class="match-teams">' +
                    '<div class="team-row">' +
                        '<span class="team-label is-aquilon">Aquilons</span>' +
                        '<div class="set-scores">' +
                            '<span class="set-score ' + s1.aqCls + '">' + s1.aq + '</span>' +
                            '<span class="set-score ' + s2.aqCls + '">' + s2.aq + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="team-row">' +
                        '<span class="team-label">' + m.adversaire + '</span>' +
                        '<div class="set-scores">' +
                            '<span class="set-score ' + s1.advCls + '">' + s1.adv + '</span>' +
                            '<span class="set-score ' + s2.advCls + '">' + s2.adv + '</span>' +
                        '</div>' +
                    '</div>' +
                '</div></div>' +
                liveInfo +
                '<div class="match-location">' + m.terrain + ' &middot; <a href="' + m.lieu_maps_url + '" target="_blank">' + m.lieu_nom + '</a></div>' +
            '</div>';
        }).join('');

        var updateEl = document.getElementById('lastUpdate');
        var live = matchs.find(function(m) { return m.statut === 'live'; });
        var played = matchs.filter(function(m) { return m.statut === 'win' || m.statut === 'loss'; }).length;
        if (live) {
            updateEl.textContent = 'En cours : vs ' + live.adversaire + ' (Set ' + live.set_courant + ' : ' + live.aq_score_courant + '-' + live.adv_score_courant + ')';
        } else if (played > 0) {
            updateEl.textContent = played + '/' + matchs.length + ' matchs jou\u00e9s';
        } else {
            updateEl.textContent = 'En attente du premier match';
        }
    }

    function updateBilan(matchs) {
        var wins = 0, losses = 0, setsW = 0, setsL = 0;
        matchs.forEach(function(m) {
            if (m.statut === 'win') wins++;
            if (m.statut === 'loss') losses++;
            if (m.aq_set1 != null && m.adv_set1 != null) { m.aq_set1 > m.adv_set1 ? setsW++ : setsL++; }
            if (m.aq_set2 != null && m.adv_set2 != null) { m.aq_set2 > m.adv_set2 ? setsW++ : setsL++; }
        });
        document.getElementById('bilanWins').textContent = wins;
        document.getElementById('bilanLosses').textContent = losses;
        document.getElementById('bilanSetsW').textContent = setsW;
        document.getElementById('bilanSetsL').textContent = setsL;
    }

    // Realtime: recharger quand un match change
    sb.channel('matchs-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'matchs' }, function() { loadMatchs(); })
        .subscribe();

    loadMatchs();
</script>

</body>
</html>
