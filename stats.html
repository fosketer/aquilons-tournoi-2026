<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats saison - Aquilons Tournoi CVS 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1A56B8;
            --blue-light: #3A76D8;
            --blue-dark: #0E3A80;
            --silver: #A8A9AD;
            --silver-light: #C8C9CD;
            --silver-dark: #78797D;
            --bg: #0C1220;
            --bg-light: #121C30;
            --bg-card: #101828;
            --gray: #8090A8;
            --white: #EDF0F5;
            --win: #4CAF50;
            --loss: #E53935;
            --gold: #FFD700;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-light) 50%, var(--bg) 100%);
            border-bottom: 3px solid var(--blue);
            padding: 1.5rem 1rem 1rem;
            text-align: center;
            position: relative; overflow: hidden;
        }
        .header::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(26,86,184,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .header-logo { width: 80px; height: auto; margin-bottom: 0.3rem; filter: drop-shadow(0 0 15px rgba(26,86,184,0.4)); }
        .team-name {
            font-family: 'Oswald', sans-serif; font-size: 2rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.15em;
            background: linear-gradient(180deg, var(--silver-light) 0%, var(--silver) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .team-sub {
            font-family: 'Oswald', sans-serif; font-size: 0.85rem;
            color: var(--blue-light); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 0.1rem;
        }

        .nav {
            display: flex; justify-content: center;
            background: var(--bg-light); border-bottom: 1px solid rgba(26,86,184,0.2);
        }
        .nav a {
            flex: 1; max-width: 200px; text-align: center; padding: 0.8rem 1rem;
            font-family: 'Oswald', sans-serif; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none;
            color: var(--silver-dark); border-bottom: 2px solid transparent; transition: all 0.3s;
        }
        .nav a:hover { color: var(--silver-light); }
        .nav a.active { color: var(--blue-light); border-bottom-color: var(--blue); }

        .content { max-width: 700px; margin: 0 auto; padding: 1rem 1rem 3rem; }

        .section-title {
            font-family: 'Oswald', sans-serif; font-size: 1.1rem;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--blue-light); margin: 1.5rem 0 0.7rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(26,86,184,0.2);
        }
        .section-title:first-child { margin-top: 0.5rem; }

        .section-sub {
            font-size: 0.7rem; color: var(--gray); font-weight: 400;
            letter-spacing: 0.05em; text-transform: none;
        }

        /* TOURNAMENT TEAMS TABLE */
        .tourney-table {
            width: 100%; border-collapse: collapse; margin-bottom: 0.5rem;
        }
        .tourney-table th {
            font-family: 'Oswald', sans-serif; font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--gray); padding: 0.4rem 0.5rem;
            text-align: left; border-bottom: 1px solid rgba(26,86,184,0.15);
        }
        .tourney-table th.num { text-align: center; width: 2rem; }
        .tourney-table th.stat { text-align: center; }
        .tourney-table td {
            font-size: 0.75rem; padding: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }
        .tourney-table td.num { text-align: center; color: var(--gray); }
        .tourney-table td.stat { text-align: center; }
        .tourney-table tr.is-aquilon td { background: rgba(26,86,184,0.08); }
        .tourney-table tr.is-aquilon td:first-child { border-left: 3px solid var(--blue); }

        .team-cell-name { font-weight: 600; }
        .team-cell-school { font-size: 0.6rem; color: var(--silver-dark); font-style: italic; display: block; margin-top: 0.1rem; }
        .team-cell-region { font-size: 0.6rem; color: var(--gray); }
        .team-cell-rank { font-weight: 600; color: var(--silver-light); }
        .rank-1 { color: var(--gold); }

        .stat-good { color: var(--win); font-weight: 600; }
        .stat-bad { color: var(--loss); font-weight: 600; }
        .stat-na { color: var(--silver-dark); font-size: 0.65rem; }

        /* REGIONAL TABLES */
        .region-card {
            background: var(--bg-card);
            border: 1px solid rgba(26,86,184,0.15);
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .region-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 1rem;
            background: rgba(26,86,184,0.08);
            border-bottom: 1px solid rgba(26,86,184,0.15);
        }
        .region-name {
            font-family: 'Oswald', sans-serif; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue-light);
        }
        .region-info { font-size: 0.6rem; color: var(--gray); }

        .region-table {
            width: 100%; border-collapse: collapse;
        }
        .region-table th {
            font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--gray); padding: 0.3rem 0.4rem;
            text-align: center; border-bottom: 1px solid rgba(26,86,184,0.1);
            font-family: 'Oswald', sans-serif;
        }
        .region-table th:first-child { text-align: center; width: 1.8rem; }
        .region-table th:nth-child(2) { text-align: left; }
        .region-table td {
            font-size: 0.7rem; padding: 0.35rem 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            text-align: center;
        }
        .region-table td:nth-child(2) { text-align: left; font-weight: 500; }
        .region-table tr.highlight td { background: rgba(26,86,184,0.1); }
        .region-table tr.highlight td:first-child { border-left: 3px solid var(--blue); }

        .no-data {
            padding: 1rem; text-align: center;
            font-size: 0.75rem; color: var(--gray); font-style: italic;
        }

        /* Region tabs */
        .region-tabs {
            display: flex; flex-wrap: wrap; gap: 0.4rem;
            padding: 0.5rem 0; margin-bottom: 0.5rem;
        }
        .region-tab {
            font-family: 'Oswald', sans-serif; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.08em;
            padding: 0.4rem 0.8rem; border-radius: 6px;
            border: 1px solid rgba(26,86,184,0.2); background: var(--bg-card);
            color: var(--gray); cursor: pointer; transition: all 0.2s;
        }
        .region-tab:hover { color: var(--white); border-color: rgba(26,86,184,0.4); }
        .region-tab.active { background: var(--blue); color: var(--white); border-color: var(--blue); }

        .region-section { display: none; }
        .region-section.show { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.jpg" alt="Aquilons" class="header-logo">
        <div class="team-name">Aquilons</div>
        <div class="team-sub">Stats de saison</div>
    </div>

    <div class="nav">
        <a href="index.html">R&eacute;sultats</a>
        <a href="classement.html">Classement</a>
        <a href="stats.html" class="active">Stats</a>
    </div>

    <div class="content">
        <div class="section-title">
            &Eacute;quipes du tournoi CVS
            <span class="section-sub">Saison RSEQ 2025-2026</span>
        </div>

        <div style="overflow-x:auto;">
        <table class="tourney-table" id="tourneyTable">
            <thead>
                <tr>
                    <th class="num">#</th>
                    <th>&Eacute;quipe</th>
                    <th>R&eacute;gion</th>
                    <th class="stat">Rang</th>
                    <th class="stat">SG</th>
                    <th class="stat">SP</th>
                    <th class="stat">PP</th>
                    <th class="stat">PC</th>
                </tr>
            </thead>
            <tbody id="tourneyBody"></tbody>
        </table>
        </div>

        <div class="section-title" style="margin-top:2rem;">
            Classements r&eacute;gionaux
            <span class="section-sub">Toutes les &eacute;quipes par r&eacute;gion</span>
        </div>

        <div class="region-tabs" id="regionTabs"></div>
        <div id="regionSections"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    // ==========================================
    // TOURNAMENT TEAMS (from Supabase)
    // ==========================================
    var SUPABASE_URL = 'https://lmbjnbnnaogpoefiywgq.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtYmpuYm5uYW9ncG9lZml5d2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEzMTAyNDEsImV4cCI6MjA1Njg4NjI0MX0.KlJHjKLsLpMHb3MjfC2xzVqMwvaFjYhbKVjR2mUXGQA';
    var TOURNOI_ID = 'a0000000-0000-0000-0000-000000000001';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTourneyTeams() {
        var res = await sb.from('adversaires').select('*').eq('tournoi_id', TOURNOI_ID).order('nom_tournoi');
        if (!res.data) return;
        var body = document.getElementById('tourneyBody');
        var i = 0;
        body.innerHTML = res.data.filter(function(a) { return a.nom_tournoi !== 'Aquilons'; }).map(function(a) {
            i++;
            var isAq = false;
            var rankCls = a.rang_regional === 1 ? 'rank-1' : '';
            var rankTxt = a.rang_regional ? a.rang_regional + (a.rang_regional === 1 ? 'er' : 'e') : '<span class="stat-na">-</span>';
            var sg = a.sets_gagnes != null ? a.sets_gagnes : '<span class="stat-na">-</span>';
            var sp = a.sets_perdus != null ? a.sets_perdus : '<span class="stat-na">-</span>';
            var pp = a.points_pour != null ? a.points_pour : '<span class="stat-na">-</span>';
            var pc = a.points_contre != null ? a.points_contre : '<span class="stat-na">-</span>';
            var school = a.nom_officiel || a.ecole || '';
            return '<tr' + (isAq ? ' class="is-aquilon"' : '') + '>' +
                '<td class="num">' + i + '</td>' +
                '<td><span class="team-cell-name">' + a.nom_tournoi + '</span>' +
                    (school ? '<span class="team-cell-school">' + school + '</span>' : '') +
                '</td>' +
                '<td class="team-cell-region">' + (a.region_rseq || '<span class="stat-na">-</span>') + '</td>' +
                '<td class="stat ' + rankCls + '">' + rankTxt + '</td>' +
                '<td class="stat">' + sg + '</td>' +
                '<td class="stat">' + sp + '</td>' +
                '<td class="stat">' + pp + '</td>' +
                '<td class="stat">' + pc + '</td>' +
                '</tr>';
        }).join('');
    }

    // ==========================================
    // RSEQ API - diffusion.s1.rseq.ca
    // ==========================================
    var RSEQ_BASE = 'https://diffusion.s1.rseq.ca/api';
    var RSEQ_YEAR = '69056db0-aac8-49b0-8fc9-4091573205ea'; // 2025-2026

    // Leagues to fetch from RSEQ API
    var RSEQ_LEAGUES = [
        {
            id: 'sag',
            name: 'Saguenay-Lac-Saint-Jean',
            leagueId: 'cad4071e-1e26-4c8d-ab45-7f72fd92fa43',
            type: 'volleyball', // uses StandingsVolleyball
            highlight: null
        },
        {
            id: 'estqc-est',
            name: 'Est-du-Qu\u00e9bec (Est)',
            leagueId: '330427e7-9293-4467-92d5-71bc84505a21',
            type: 'standings', // uses Standings
            highlight: null
        },
        {
            id: 'estqc-ouest',
            name: 'Est-du-Qu\u00e9bec (Ouest)',
            leagueId: 'a7d24a40-66f9-473c-9956-d9dc2a462819',
            type: 'standings',
            highlight: 'Armand-Saint-Onge 1'
        },
        {
            id: 'cn-d3',
            name: 'C\u00f4te-Nord (D3)',
            leagueId: '533891a0-5f82-4d54-b1fc-3815d1b6bed2',
            type: 'volleyball',
            highlight: null
        },
        {
            id: 'cn-d4',
            name: 'C\u00f4te-Nord (D4)',
            leagueId: '775bc7f1-352c-4f4e-8339-8f5e65e0598d',
            type: 'volleyball',
            highlight: null
        }
    ];

    // Hardcoded regions (not available on S1)
    var STATIC_REGIONS = [
        {
            id: 'qca',
            name: 'QCA (Qu\u00e9bec-Chaudi\u00e8re-Appalaches)',
            info: 'Benjamin F\u00e9minin D3 \u2014 Section Juv. Notre-Dame',
            highlight: 'Jean-de-Br\u00e9beuf 1',
            cols: ['#', '\u00c9quipe', 'MJ', 'SG', 'SP', 'PP', 'PC', 'Rang'],
            teams: [
                ['1', 'Juv. Notre-Dame 1', 3, 9, 6, 174, 150, 1],
                ['2', 'E.S. Veilleux', 3, 8, 5, 169, 162, 2],
                ['3', 'Jean-de-Br\u00e9beuf 1', 3, 3, 4, 135, 150, 3],
                ['4', 'Aubier 1', 3, 8, 2, 152, 168, 4]
            ]
        }
    ];

    var regions = [];

    function fetchLeagueDiffusion(leagueId) {
        return fetch(RSEQ_BASE + '/LeagueApi/GetLeagueDiffusion/?leagueId=' + leagueId)
            .then(function(r) { return r.json(); });
    }

    function buildRegionFromAPI(cfg, data) {
        var region = {
            id: cfg.id,
            name: cfg.name,
            highlight: cfg.highlight,
            cols: [],
            teams: [],
            info: ''
        };

        var sportName = data.SportName || 'Volleyball';
        var catName = data.CategoryName || '';
        var sexName = data.SexTypeName || '';
        var divName = data.DivisionName || '';
        region.info = [catName, sexName, divName].filter(Boolean).join(' ');

        if (cfg.type === 'volleyball' && data.StandingsVolleyball && data.StandingsVolleyball.length > 0) {
            // Determine which tournaments are shown
            var showT = [];
            var first = data.StandingsVolleyball[0];
            for (var i = 1; i <= 12; i++) {
                if (first['ShowTournament' + i]) showT.push(i);
            }
            region.cols = ['#', '\u00c9quipe'];
            showT.forEach(function(t) { region.cols.push('T' + t); });
            region.cols.push('Total');

            data.StandingsVolleyball.forEach(function(s) {
                var row = [s.PositionFormatted, s.TeamName];
                showT.forEach(function(t) {
                    row.push(s['Tournament' + t + 'Formatted'] || '-');
                });
                row.push(s.TotalPointsFormatted || '-');
                region.teams.push(row);
            });
        } else if (data.Standings && data.Standings.length > 0) {
            region.cols = ['#', '\u00c9quipe', 'MJ', 'SG', 'SP', 'PP', 'PC'];
            data.Standings.forEach(function(s) {
                region.teams.push([
                    s.PositionFormatted,
                    s.TeamName,
                    s.GamesPlayed,
                    s.SetWins,
                    s.SetLosses,
                    s.PointsFor,
                    s.PointsAgaints
                ]);
            });
        }
        return region;
    }

    function buildRegionStatic(cfg) {
        return cfg; // already in the right format
    }

    function renderRegions() {
        var tabsEl = document.getElementById('regionTabs');
        var sectionsEl = document.getElementById('regionSections');
        var tabsHtml = '';
        var sectHtml = '';

        regions.forEach(function(r, idx) {
            tabsHtml += '<div class="region-tab' + (idx === 0 ? ' active' : '') + '" onclick="showRegion(\'' + r.id + '\')">' + r.name + '</div>';

            sectHtml += '<div class="region-section' + (idx === 0 ? ' show' : '') + '" id="region-' + r.id + '">';
            sectHtml += '<div class="region-card">';
            sectHtml += '<div class="region-header"><span class="region-name">' + r.name + '</span><span class="region-info">' + r.info + '</span></div>';

            if (r.teams.length === 0) {
                sectHtml += '<div class="no-data">Aucune donn\u00e9e disponible</div>';
            } else {
                sectHtml += '<table class="region-table"><thead><tr>';
                r.cols.forEach(function(c) { sectHtml += '<th>' + c + '</th>'; });
                sectHtml += '</tr></thead><tbody>';

                r.teams.forEach(function(t) {
                    var isHl = r.highlight && t[1] === r.highlight;
                    sectHtml += '<tr' + (isHl ? ' class="highlight"' : '') + '>';
                    t.forEach(function(val) {
                        if (val === null) val = '-';
                        sectHtml += '<td>' + val + '</td>';
                    });
                    sectHtml += '</tr>';
                });
                sectHtml += '</tbody></table>';
            }

            sectHtml += '</div></div>';
        });

        tabsEl.innerHTML = tabsHtml;
        sectionsEl.innerHTML = sectHtml;
    }

    function showRegion(id) {
        document.querySelectorAll('.region-section').forEach(function(el) { el.classList.remove('show'); });
        document.querySelectorAll('.region-tab').forEach(function(el) { el.classList.remove('active'); });
        document.getElementById('region-' + id).classList.add('show');
        var tabs = document.querySelectorAll('.region-tab');
        for (var i = 0; i < tabs.length; i++) {
            var r = regions[i];
            if (r && r.id === id) tabs[i].classList.add('active');
        }
    }

    async function loadRegions() {
        // Add static regions first (QCA)
        STATIC_REGIONS.forEach(function(cfg) {
            regions.push(buildRegionStatic(cfg));
        });

        // Fetch all RSEQ leagues in parallel
        var results = await Promise.allSettled(
            RSEQ_LEAGUES.map(function(cfg) {
                return fetchLeagueDiffusion(cfg.leagueId).then(function(data) {
                    return { cfg: cfg, data: data };
                });
            })
        );

        results.forEach(function(r) {
            if (r.status === 'fulfilled') {
                var region = buildRegionFromAPI(r.value.cfg, r.value.data);
                if (region.teams.length > 0) {
                    regions.push(region);
                }
            }
        });

        renderRegions();
    }

    // ==========================================
    // INIT
    // ==========================================
    loadTourneyTeams();
    loadRegions();
    </script>
</body>
</html>
